<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniCar Roadmap</title>
<!-- Sinh tu ROADMAP.md bang tools/roadmap_html.py - dung sua tay, sua ROADMAP.md roi chay lai script. -->
<style>
:root {
  --bg: #f1f3f5; --card: #fff; --text: #0f1115; --sub: #5f6672; --sep: rgba(60,60,67,.14);
  --chip: rgba(120,120,128,.12); --accent: #1f2329; --bar: #1f2329;
  --low: #1e8e5a; --mid: #b7791f; --high: #c53030; --other: #6b7280;
  --hero1: #353a43; --hero2: #101216;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000; --card: #1c1c1e; --text: #f2f3f5; --sub: #9aa1ab; --sep: rgba(84,84,88,.55);
    --chip: rgba(120,120,128,.24); --accent: #e9ebee; --bar: #e9ebee;
    --low: #4cc38a; --mid: #e3b341; --high: #ff6b6b; --other: #9aa1ab;
  }
}
:root[data-theme="dark"] {
  --bg: #000; --card: #1c1c1e; --text: #f2f3f5; --sub: #9aa1ab; --sep: rgba(84,84,88,.55);
  --chip: rgba(120,120,128,.24); --accent: #e9ebee; --bar: #e9ebee;
  --low: #4cc38a; --mid: #e3b341; --high: #ff6b6b; --other: #9aa1ab;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip); padding: 1px 5px; border-radius: 5px; }
.wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }

.hero { border-radius: 22px; padding: 22px; color: #fff; background: linear-gradient(180deg, var(--hero1), var(--hero2));
  box-shadow: inset 0 0 0 .5px rgba(255,255,255,.22), 0 10px 24px rgba(0,0,0,.18); position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0 0 50% 0; background: linear-gradient(180deg, rgba(255,255,255,.08), transparent); pointer-events: none; }
.hero h1 { margin: 0 0 4px; font-size: 26px; }
.hero .goal { color: rgba(255,255,255,.8); margin: 0 0 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.stat { background: rgba(255,255,255,.08); border-radius: 14px; padding: 10px 12px; }
.stat .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12.5px; color: rgba(255,255,255,.7); }
.track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 14px; }
.track i { display: block; height: 100%; background: #fff; border-radius: 3px; transition: width .3s; }

.intro { margin: 18px 4px 0; color: var(--sub); font-size: 14px; }
.intro p { margin: 6px 0; }
.intro ul { margin: 6px 0; padding-left: 20px; }

.tools { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools input[type=search] { flex: 1 1 200px; min-width: 0; border: 0; border-radius: 10px; padding: 9px 12px; background: var(--chip); color: var(--text); font: inherit; outline: none; }
.chipbtn { border: 0; border-radius: 16px; padding: 7px 12px; background: var(--chip); color: var(--text); font: inherit; font-size: 13.5px; cursor: pointer; }
.chipbtn.on { background: var(--accent); color: var(--bg); }
.chipbtn .dot { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }

.nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.nav a { flex: none; text-decoration: none; color: var(--sub); font-size: 13px; background: var(--chip); border-radius: 14px; padding: 5px 10px; }

.sec { margin-top: 26px; }
.sec h2 { font-size: 18px; margin: 0 4px 4px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.sec h2 .pct { font-size: 13px; color: var(--sub); font-weight: 500; font-variant-numeric: tabular-nums; flex: none; }
.sec .bar { height: 4px; border-radius: 2px; background: var(--chip); margin: 6px 4px 10px; overflow: hidden; }
.sec .bar i { display: block; height: 100%; background: var(--bar); transition: width .3s; }
.notes { margin: 0 4px 10px; color: var(--sub); font-size: 14px; }
.notes p { margin: 4px 0; }
.notes ul { margin: 4px 0; padding-left: 20px; }
.card { background: var(--card); border-radius: 16px; overflow: hidden; }
.item { display: flex; gap: 12px; padding: 13px 14px; }
.item + .item { border-top: .5px solid var(--sep); }
.item.hide { display: none; }
.check { flex: none; width: 22px; height: 22px; border-radius: 11px; border: 2px solid var(--sub); margin-top: 1px; cursor: pointer; display: grid; place-items: center; background: none; padding: 0; }
.check svg { width: 13px; height: 13px; opacity: 0; }
.item.done .check { background: var(--accent); border-color: var(--accent); }
.item.done .check svg { opacity: 1; color: var(--bg); }
.item.done .t { color: var(--sub); text-decoration: line-through; }
.body { flex: 1; min-width: 0; }
.row1 { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.t { font-weight: 500; }
.diff { flex: none; font-size: 12px; font-weight: 600; border-radius: 10px; padding: 2px 9px; white-space: nowrap; }
.diff.low { color: var(--low); background: color-mix(in srgb, var(--low) 14%, transparent); }
.diff.mid { color: var(--mid); background: color-mix(in srgb, var(--mid) 14%, transparent); }
.diff.high { color: var(--high); background: color-mix(in srgb, var(--high) 14%, transparent); }
.diff.other { color: var(--other); background: var(--chip); }
.d { color: var(--sub); font-size: 14px; margin-top: 3px; }
.dw { font-size: 13.5px; margin-top: 6px; padding: 7px 10px; border-radius: 10px; background: var(--chip); }
.dw b { font-weight: 600; }
.local { font-size: 12px; color: var(--sub); margin-left: 6px; }
.grp { padding: 14px 14px 8px; background: var(--chip); }
.grp + .item { border-top: 0; }
.item + .grp { border-top: .5px solid var(--sep); }
.grp .gt { font-size: 13px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; color: var(--sub); }
.grp .gn { font-size: 13.5px; color: var(--sub); margin-top: 3px; }
.grp .gn p { margin: 2px 0; }
.grp.hide { display: none; }
.empty { padding: 14px; color: var(--sub); font-size: 14px; display: none; }
.foot { margin-top: 30px; color: var(--sub); font-size: 12.5px; text-align: center; }
@media (max-width: 520px) { .row1 { flex-direction: column; gap: 4px; } .hero { padding: 18px; } .hero h1 { font-size: 22px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1 id="title"></h1>
    <p class="goal" id="goal"></p>
    <div class="stats" id="stats"></div>
    <div class="track"><i id="total-bar"></i></div>

    <button class="chipbtn" data-lv="high"><span class="dot" style="background:var(--high)"></span>Cao</button>
    <button class="chipbtn" id="hide-done">Ẩn mục đã xong</button>
    <button class="chipbtn" id="theme" title="Đổi giao diện sáng / tối">◐</button>

  <nav class="nav" id="nav"></nav>
  <div id="secs"></div>

</div>

e": "<b>Chốt giá và bảng Lite / Pro<\/b>", "diff": "Thấp", "level": "low", "desc": ["Dựa trên khảo sát và tính năng dùng nhiều nhất: tính năng được dùng nhiều nhất nên nằm trong Pro, nhưng Lite vẫn", "phải dùng được."], "doneWhen": "", "g": -1}], "notes": [{"kind": "p", "html": "Cuối thời kỳ miễn phí, xem số liệu rồi mới quyết định. Chưa đạt thì kéo dài miễn phí, sửa tiếp, hoặc đổi hướng tính năng."}], "groups": []}, {"title": "Phát hành 3 – Chính thức: OmniCar miễn phí, dùng thử đủ Pro", "items": [{"done": false, "title": "<b>Dùng thử đủ Pro 7 ngày lái xe<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Đếm theo <b>ngày có cắm CarPlay<\/b>, không phải ngày lịch: cài xong để đó không mất lượt thử. Đủ mọi tính năng Pro."], "doneWhen": "cài mới, cắm xe 7 ngày khác nhau → ngày thứ 8 về Lite; không cắm xe thì không bị trừ ngày.", "g": -1}, {"done": false, "title": "<b>Đếm ngược rõ ràng, nhắc nhẹ<\/b>", "diff": "Thấp", "level": "low", "desc": ["Thẻ đầu trang Cài đặt hiện \"Dùng thử Pro · còn 5 ngày\". Nhắc một lần trên iPhone khi còn 2 ngày và khi hết hạn.", "Không bao giờ hiện nhắc nhở trên màn xe khi đang lái."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Hết hạn mềm<\/b>", "diff": "Thấp", "level": "low", "desc": ["Về Lite nhưng giữ nguyên mọi cài đặt Pro (bố cục, hình nền, kiểu khởi động); mua Pro là có lại ngay, không phải cài lại.", "Tính năng Pro đang dùng tự đổi về bản Lite tương ứng (3 ô → 2 ô 50/50…), không để màn xe trống hay lỗi."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Chống thử lại vô hạn<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Lưu trạng thái thử theo máy (băm định danh máy, lưu ở chỗ còn lại sau khi gỡ / cài lại tweak). Không gửi đi đâu."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Xem thử không cần xe<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Trang trong Cài đặt mô phỏng màn xe (như tools/preview): bấm thử chia màn, bong bóng tốc độ, kiểu khởi động", "ngay trên iPhone, cho người chưa ra xe hoặc đang xem trước khi cài."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Giới hạn tính năng theo bảng Lite / Pro<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Khoá tính năng Pro sau khi hết thử. Cài đặt của Lite gọn: chỉ các mục Lite, cuối trang khối \"Có trong Pro\"", "liệt kê ngắn (xem thử được, không bấm dùng được)."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Nút \"Nâng cấp lên Pro\"<\/b>", "diff": "Thấp", "level": "low", "desc": ["Một dòng trong Cài đặt và trên mục Pro bị khoá, mở trang mua Pro trên Chariz. Không hiện quảng cáo trên màn xe."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Phát hành OmniCar miễn phí trên repo riêng (và Chariz)<\/b>", "diff": "Thấp", "level": "low", "desc": ["Mô tả ghi rõ: \"Miễn phí, dùng thử đủ Pro 7 ngày lái xe\", bảng so sánh Lite / Pro, link trang tương thích."], "doneWhen": "1.000 lượt cài, đánh giá trung bình ≥ 4 sao, ít nhất 5 % người thử mua Pro.", "g": -1}], "notes": [{"kind": "p", "html": "Mục tiêu: người dùng thấy <b>hết<\/b> OmniCar làm được gì trên chính xe của họ, rồi mới quyết định mua. Một gói OmniCar miễn phí chứa toàn bộ mã; mới cài là chạy đủ Pro trong thời gian thử, hết hạn thì về Lite."}], "groups": []}, {"title": "Phát hành 4 – OmniCar Pro (trả phí)", "items": [{"done": false, "title": "<b>Gói mở khoá Pro trên Chariz<\/b>", "diff": "Vừa", "level": "mid", "desc": ["\"OmniCar Pro\" là gói trả phí nhỏ trên Chariz, chỉ chứa khoá bản quyền kiểm tra bằng DRM của Chariz; OmniCar miễn", "phí (cài từ repo riêng hoặc Chariz) thấy khoá hợp lệ thì mở đủ Pro. Mua xong không phải gỡ / cài lại gì."], "doneWhen": "mua trên Chariz, Pro mở trong 1 phút; đăng nhập Chariz trên máy mới là khôi phục được Pro.", "g": -1}, {"done": false, "title": "<b>Repo riêng dẫn sang Chariz<\/b>", "diff": "Thấp", "level": "low", "desc": ["Trang mô tả OmniCar trên repo riêng và trang giới thiệu có nút \"Mua Pro trên Chariz\"; ghi rõ repo riêng không bán gì."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Bán thêm trên Havoc (tuỳ chọn)<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Chỉ khi Havoc chấp nhận và không đòi bán độc quyền; khoá phải nhận cả DRM của Havoc, cùng giá với Chariz."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Giá và khuyến mãi ra mắt<\/b>", "diff": "Thấp", "level": "low", "desc": ["Đề xuất 7,99–9,99 USD (DuoDash 12,99 USD), chốt lại theo khảo sát; giảm 30 % tuần đầu; người dùng thời kỳ miễn phí có mã giảm thêm;", "giảm thêm trong 48 giờ sau khi hết dùng thử."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Phát hành Pro trên Chariz<\/b>", "diff": "Thấp", "level": "low", "desc": ["Mô tả nói rõ những gì có trong Pro và những gì không làm được (DRM), link trang tương thích."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Hỗ trợ sau bán<\/b>", "diff": "Thấp", "level": "low", "desc": ["Mẫu trả lời cho lỗi thường gặp, cam kết phản hồi trong 48 giờ, quy trình hoàn tiền."], "doneWhen": "tỉ lệ hoàn tiền dưới 3 % trong tháng đầu.", "g": -1}], "notes": [], "groups": []}, {"title": "Phát hành 5 – Cập nhật và tăng trưởng", "items": [{"done": false, "title": "<b>1.1 – Màn chính và Khởi động<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Phần Màn chính CarPlay và Màn hình khởi động mới của Mức 2."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>1.2 – Chia màn hình và Lái xe<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Phần còn lại của Mức 2: 8 bố cục, chế độ lái, nút vô lăng, hồ sơ theo xe."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>2.0 – Vượt DuoDash<\/b>", "diff": "Cao", "level": "high", "desc": ["Mức 3: bố cục tự do, tự phóng to bản đồ khi rẽ, ô tiện ích, cụm đồng hồ, widget màn chính."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Gói thêm \"OmniCar Drive\" (camera / ADAS)<\/b>", "diff": "Cao", "level": "high", "desc": ["Mức 4 bán riêng hoặc là gói nâng cấp, vì tốn nhiều công và chỉ dành cho người muốn dùng camera. Pro không bị mất tính năng đã có."], "doneWhen": "", "g": -1}, {"done": false, "title": "<b>Chương trình giới thiệu<\/b>", "diff": "Thấp", "level": "low", "desc": ["Mã giới thiệu cho người dùng / YouTuber; giảm giá theo mùa (Black Friday, Tết)."], "doneWhen": "", "g": -1}], "notes": [{"kind": "p", "html": "Mỗi bản lớn đi kèm một video ngắn và một bài đăng; bản nhỏ sửa lỗi phát hành khi cần."}], "groups": []}, {"title": "Bảng Lite và Pro", "items": [], "notes": [{"kind": "p", "html": "Áp dụng sau khi hết 7 ngày dùng thử. Nguyên tắc: Lite chỉ có tính năng đơn giản, đủ để người dùng thấy OmniCar làm được gì và muốn lên Pro; không có tuỳ chỉnh, không có tính năng nâng cao. Pro là toàn bộ sức mạnh. Bản sửa lỗi có cho cả hai."}, {"kind": "li", "html": "<b>Chia màn hình<\/b>: Lite 2 ô 50/50 cố định, chọn app cho 2 ô · Pro kéo đổi tỉ lệ, 3 ô, đủ bố cục, yêu thích, gần đây, bố cục tự do, tự phóng to bản đồ, hồ sơ theo xe."}, {"kind": "li", "html": "<b>App iPhone trên xe (App Bridge)<\/b>: Lite 1 app iPhone, chỉ mở toàn màn · Pro không giới hạn, app iPhone vào ô chia màn."}, {"kind": "li", "html": "<b>Màn chính CarPlay<\/b>: Lite không có · Pro ẩn / sắp xếp app, cỡ icon, cột / hàng, dock, hình nền, gói icon, thư mục, widget."}, {"kind": "li", "html": "<b>Màn hình khởi động<\/b>: Lite 1 video của bạn, không tuỳ chỉnh · Pro mọi kiểu (logo + âm thanh, lời chào, thời tiết, theo dịp, ngẫu nhiên, hiệu ứng, chia sẻ mẫu)."}, {"kind": "li", "html": "<b>Bong bóng tốc độ<\/b>: Lite 1 kiểu, 1 nguồn, cỡ mặc định · Pro đủ kiểu, mọi nguồn, chỉnh cỡ / vị trí, cảnh báo quá tốc độ tuỳ chỉnh."}, {"kind": "li", "html": "<b>Lái xe an toàn<\/b>: Lite chế độ lái + cảnh báo quá tốc độ cơ bản (an toàn không khoá sau tiền; Lite chạy được video qua App Bridge nên bắt buộc có chế độ lái) · Pro nhắc nghỉ, nhật ký và điểm lái, HUD, giữ tốc độ trong hầm, nút vô lăng, lệnh giọng nói."}, {"kind": "li", "html": "<b>Cài đặt<\/b>: Lite đủ ngôn ngữ, không sao lưu, không Phím tắt Siri · Pro sao lưu / khôi phục, Phím tắt Siri, hồ sơ theo xe."}, {"kind": "li", "html": "<b>Hỗ trợ<\/b>: Lite qua cộng đồng · Pro hỗ trợ trực tiếp, ưu tiên sửa lỗi theo đầu xe."}, {"kind": "li", "html": "<b>Camera / ADAS<\/b>: không có trong Lite · gói thêm \"OmniCar Drive\"."}], "groups": []}, {"title": "Mức 1 – Cần ngay (trước khi mở repo miễn phí)", "items": [{"done": false, "title": "<b>Gửi log một chạm<\/b>", "diff": "Thấp", "level": "low", "desc": ["Nút trong Cài đặt: gói OmniCar.log + phiên bản iOS, máy, đầu xe, danh sách tweak → share sheet.", "Code: Hỗ trợ &gt; Gửi log (OMCShareReport) → OmniCar-log-&lt;ngày&gt;.txt. Chờ thử gửi Zalo trên máy."], "doneWhen": "khách gửi được file qua Zalo / email trong 3 chạm.", "g": 0}, {"done": false, "title": "<b>Màn chẩn đoán<\/b>", "diff": "Thấp", "level": "low", "desc": ["Độ phân giải màn xe, dây / không dây, nhiệt độ máy, FPS app iPhone, phiên bản từng tính năng.", "Code: Hỗ trợ &gt; Chẩn đoán (máy, màn xe, tính năng + hook trên iOS này, chế độ cứu, tweak xung đột). Chưa có", "FPS app iPhone (cần đo trong App Bridge). Dây / không dây đọc từ CarKit: chờ thử trên xe."], "doneWhen": "", "g": 0}, {"done": false, "title": "<b>Thông tin đầu xe<\/b>", "diff": "Thấp", "level": "low", "desc": ["Độ phân giải, tỉ lệ màn, chất lượng video gợi ý (gộp vào Màn chẩn đoán).", "Code: CarPlay ghi màn xe + phiên CarKit mỗi lần cắm (OMCCrashGuard), Chẩn đoán &gt; Màn xe. Chờ thử trên xe."], "doneWhen": "", "g": 0}, {"done": false, "title": "<b>Phát hiện tweak xung đột<\/b>", "diff": "Thấp", "level": "low", "desc": ["Thấy CarBridge, DuoDash, TrueDash, CarPlayEnable… đang bật → cảnh báo trong Cài đặt (không tự gỡ tweak của người khác).", "Code: thẻ cảnh báo đầu trang chính khi dylib của tweak đó đang nạp; Chẩn đoán liệt kê cả gói đã cài."], "doneWhen": "", "g": 0}, {"done": false, "title": "<b>Chế độ cứu (rescue)<\/b>", "diff": "Vừa", "level": "mid", "desc": ["CarPlay sập 2 lần liền trong 60 giây sau khi cắm → tự tắt tính năng nghi gây lỗi, lần cắm sau báo cho người dùng.", "Code: OMCCrashGuard (Core) nghi tính năng theo backtrace, thông báo trên iPhone, thẻ \"Bật lại\" ở trang chính.", "Thử: Chẩn đoán, nhấn giữ dòng OmniCar → chọn tính năng → cắm xe 3 lần."], "doneWhen": "cố tình gây crash trong một tính năng, CarPlay tự phục hồi ở lần cắm thứ 3.", "g": 0}, {"done": false, "title": "<b>Tự kiểm tra trên xe (chỉ bản dev)<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Công cụ cho tác giả, không phát hành: macro <code>OMC_AUTOTEST<\/code> (Core/OmniCar.h, hoặc <code>make OMC_AUTOTEST=0<\/code>) bỏ hẳn", "khỏi bản phát hành. Cài đặt &gt; Hỗ trợ &gt; Tự kiểm tra: chọn tính năng → mỗi tính năng tự chạy bộ test của nó trên xe,", "mỗi bước ghi đạt / lỗi + lý do + trạng thái + ảnh màn xe → Gửi log. Process sập giữa chừng thì lần sau chạy tiếp.", "Bộ test: Chia màn hình (bố cục, tỉ lệ, đổi chỗ, cửa sổ nổi, bảng chọn / bảng bố cục, toàn màn, lệnh URL, yêu thích,", "gần đây, bấm nhanh), App Bridge (trong ô, tỉ lệ, đổi chỗ, 3 ô, chặn cửa sổ nổi, toàn màn, đóng, icon, 2 app cùng", "lúc), Màn hình khởi động (phát, khung chạy, tự tắt, chạm bỏ qua, tắt tính năng), Bong bóng tốc độ (hiện trên xe,", "số, gần / vượt giới hạn, ẩn khi Split Screen chiếm màn, 18 kiểu, cỡ, mất nguồn).", "Code: Core/OMCTest.h (khung), Features/SplitScreen/SCPAutoTest.mm, cuối StartupScreen.x, cuối SPPBubble.mm,", "Prefs/OMCAutoTestController.m. Chờ chạy thử trên xe."], "doneWhen": "một lần chạy trên xe ra đủ kết quả từng bước, gửi log có ảnh, sửa lỗi không cần thử tay lại từng ca.", "g": 0}, {"done": false, "title": "<b>Thử với nhiều app hơn<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Danh sách tối thiểu: YouTube, TikTok, Facebook, Instagram, Chrome, Safari, Zalo, Grab, Shopee, X, Twitch, Plex.", "Bảng ghi kết quả: COMPATIBILITY.md."], "doneWhen": "có bảng app chạy tốt / chạy được / không chạy kèm lý do, đưa lên trang tương thích.", "g": 0}, {"done": false, "title": "<b>Chạy thật trên iOS 15 16 17 và 18<\/b>", "diff": "Cao", "level": "high", "desc": ["App Bridge và Chia màn hình đang dựa selector iOS 16. Kiểm tra từng selector, có đường dự phòng khi thiếu.", "Kiểm tra lại luôn app có giao diện CarPlay riêng chạy trong ô.", "Chẩn đoán hiện hook thiếu trên từng iOS; ghi kết quả vào COMPATIBILITY.md."], "doneWhen": "thử đủ 4 bố cục + YouTube / TikTok qua App Bridge trên iOS 15, 16, 17, 18 (rootless), ghi kết quả.", "g": 0}, {"done": false, "title": "<b>Đơn vị và quy chuẩn theo nước<\/b>", "diff": "Thấp", "level": "low", "desc": ["km/h ↔ mph; biển tốc độ kiểu Viên (tròn viền đỏ) / kiểu Mỹ (chữ nhật trắng); lái tay phải → đảo bố cục mặc định."], "doneWhen": "", "g": 1}, {"done": false, "title": "<b>Hướng dẫn lần đầu<\/b>", "diff": "Thấp", "level": "low", "desc": ["3–4 trang: chọn app lên xe, chọn bố cục đầu tiên, bật bong bóng tốc độ, cách gọi bảng bố cục trên xe."], "doneWhen": "", "g": 1}, {"done": false, "title": "<b>Nhiều ngôn ngữ<\/b>", "diff": "Thấp (dịch) / Vừa (kiểm tra)", "level": "low", "desc": ["Tối thiểu: en, vi, es, pt-BR, de, fr, it, ru, zh-Hans, ja, ko, ar (RTL), th, id."], "doneWhen": "mọi trang Cài đặt và chữ trên xe không bị cắt ở ngôn ngữ dài nhất (de) và RTL (ar).", "g": 1}, {"done": false, "title": "<b>Trang tương thích công khai<\/b>", "diff": "Thấp", "level": "low", "desc": ["iOS, kiểu jailbreak (rootless / roothide), chip, đầu xe đã thử, app đã thử, giới hạn đã biết (DRM)."], "doneWhen": "", "g": 1}, {"done": false, "title": "<b>Bộ tài liệu bán hàng<\/b>", "diff": "Thấp", "level": "low", "desc": ["Video 60 giây, 6 ảnh chụp màn xe, mô tả ngắn / dài cho repo riêng và Chariz, FAQ, chính sách riêng tư."], "doneWhen": "", "g": 1}, {"done": false, "title": "<b>Bản quyền, Lite / Pro và dùng thử<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Nền tảng kỹ thuật cho Phát hành 3 và 4: cờ Pro dùng chung cho mọi tính năng, đếm ngày dùng thử, đọc khoá của gói Pro."], "doneWhen": "", "g": 1}, {"done": false, "title": "<b>Phóng to tạm một ô<\/b>", "diff": "Thấp", "level": "low", "desc": ["Chạm đúp thanh \"•••\" → ô to toàn vùng app, chạm lại → về bố cục cũ (khác \"toàn màn\" là không đóng các ô khác)."], "doneWhen": "", "g": 2}, {"done": false, "title": "<b>Bàn phím trên màn xe<\/b>", "diff": "Cao", "level": "high", "desc": ["Một bàn phím chung cho mọi ô (kể cả app iPhone qua App Bridge), kiểu HarmonyOS, có tiếng Việt và các ngôn ngữ chính."], "doneWhen": "gõ được tìm kiếm trong YouTube và ô địa chỉ của Safari trên xe.", "g": 2}], "notes": [{"kind": "p", "html": "Thiếu một trong các mục này thì khách quốc tế không mua, hoặc mua rồi đòi hoàn tiền."}], "groups": [{"title": "Hỗ trợ và ổn định", "notes": []}, {"title": "Bán quốc tế", "notes": []}, {"title": "Dùng hằng ngày", "notes": []}]}, {"title": "Mức 2 – Quan trọng (bằng DuoDash, làm ngay sau bản bán đầu tiên)", "items": [{"done": false, "title": "<b>Ẩn và sắp xếp app<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Ẩn cả app CarPlay gốc không dùng (CarBridge có), kéo đổi thứ tự app iPhone và app CarPlay trong một danh sách."], "doneWhen": "thứ tự và app ẩn giữ nguyên sau khi rút / cắm lại và sau respring.", "g": 0}, {"done": false, "title": "<b>Cỡ icon<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Thanh trượt cỡ icon trên màn chính (ví dụ 80–130 %), lưới tự tính lại để không tràn màn."], "doneWhen": "", "g": 0}, {"done": false, "title": "<b>Số cột / hàng và tên app<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Chọn số cột × hàng mỗi trang, ẩn / hiện tên dưới icon, khoảng cách icon."], "doneWhen": "", "g": 0}, {"done": false, "title": "<b>Hình nền màn chính<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Chọn ảnh từ Ảnh / Tệp, cắt theo tỉ lệ màn xe, chỉnh độ mờ và độ tối để icon vẫn dễ nhìn."], "doneWhen": "", "g": 0}, {"done": false, "title": "<b>Dock tuỳ chỉnh<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Chọn app nào nằm cố định trên dock (kể cả app iPhone), ẩn mục gợi ý của CarPlay."], "doneWhen": "", "g": 0}, {"done": false, "title": "<b>Khung chọn kiểu khởi động<\/b>", "diff": "Vừa", "level": "mid", "desc": ["Trang Cài đặt mới: danh sách kiểu (Video, Logo + âm thanh, Lời chào, Thời tiết…), xem trước, ào được làm CarPlay sập: lỗi trong một tính năng chỉ được tắt tính năng đó."}, {"kind": "li", "html": "Đo pin và nhiệt cho mọi tính năng chạy liên tục, ghi số đo vào ghi chú phát hành."}], "groups": []}]};
const GEN = "2026-10-13";
const $ = s => document.querySelector(s);
const TICK = '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';
const KEY = 'omnicar-roadmap-local';
let local = {};
try { local = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(local)); } catch (e) {} };
const state = { lv: 'all', q: '', hideDone: false };
const strip = h => h.replace(/<[^>]+>/g, '');
const idOf = (si, ii) => si + ':' + strip(DOC.sections[si].items[ii].title);
const isDone = (si, ii) => { const id = idOf(si, ii); return id in local ? local[id] : DOC.sections[si].items[ii].done; };

$('#title').textContent = DOC.title;
$('#gen').textContent = GEN;
// Dong "Muc tieu: ..." dau tien len the dau trang, phan con lai cua phan gioi thieu dat ben duoi
const intro = DOC.intro.slice();
const gi = intro.findIndex(b => b.kind === 'p' && strip(b.html).startsWith('Mục tiêu'));
if (gi >= 0) {
  let goal = intro[gi].html; intro.splice(gi, 1);
  while (intro[gi] && intro[gi].kind === 'p' && !/^(Cách dùng|Đã có)/.test(strip(intro[gi].html))) { goal += ' ' + intro[gi].html; intro.splice(gi, 1); }
  goal = goal.replace(/^Mục tiêu:\s*/, '');
  $('#goal').innerHTML = goal.charAt(0).toUpperCase() + goal.slice(1);
}
const blocks = list => { let h = '', ul = false;
  for (const b of list) {
    if (b.kind === 'li') { if (!ul) { h += '<ul>'; ul = true; } h += '<li>' + b.html + '</li>'; }
    else { if (ul) { h += '</ul>'; ul = false; } h += '<p>' + b.html + '</p>'; }
  }
  return h + (ul ? '</ul>' : ''); };
$('#intro').innerHTML = blocks(intro);

const short = t => t.replace(/^Giai đoạn (\d+)\s*–\s*/, 'GĐ $1 · ').replace(/^Mức (\d+)\s*–\s*/, 'Mức $1 · ').replace(/^Phát hành (\d+)\s*–\s*/, 'PH $1 · ').replace(/\s*\(.*\)$/, '');
$('#nav').innerHTML = DOC.sections.map((s, si) => `<a href="#s${si}">${short(s.title)}</a>`).join('');
$('#secs').innerHTML = DOC.sections.map((s, si) => `
  <section class="sec" id="s${si}">
    <h2><span>${s.title}</span>${s.items.length ? `<span class="pct" id="p${si}"></span>` : ''}</h2>
    ${s.items.length ? `<div class="bar"><i id="b${si}"></i></div>` : ''}
    ${s.notes.length ? `<div class="notes">${blocks(s.notes)}</div>` : ''}
    ${s.items.length ? `<div class="card">${s.items.map((it, ii) => `${it.g >= 0 && (ii === 0 || s.items[ii - 1].g !== it.g) ? `
      <div class="grp" data-s="${si}" data-g="${it.g}"><div class="gt">${s.groups[it.g].title}</div>${s.groups[it.g].notes.length ? `<div class="gn">${blocks(s.groups[it.g].notes)}</div>` : ''}</div>` : ''}
      <div class="item" data-s="${si}" data-i="${ii}" data-g="${it.g}" data-lv="${it.level}">
        <button class="check" aria-label="Đánh dấu xong">${TICK}</button>
        <div class="body">
          <div class="row1"><div class="t">${it.title}</div>${it.diff ? `<span class="diff ${it.level}">${it.diff}</span>` : ''}</div>
          ${it.desc.map(d => `<div class="d">${d}</div>`).join('')}
          ${it.doneWhen ? `<div class="dw"><b>Xong khi:</b> ${it.doneWhen}</div>` : ''}
        </div>
      </div>`).join('')}<div class="empty">Không có mục nào khớp bộ lọc.</div></div>` : ''}
  </section>`).join('');

function refresh() {
  let all = 0, done = 0; const by = { low: 0, mid: 0, high: 0 };
  DOC.sections.forEach((s, si) => {
    if (!s.items.length) return;
    let d = 0, shown = 0; const gShown = {};
    s.items.forEach((it, ii) => {
      const el = document.querySelector(`.item[data-s="${si}"][data-i="${ii}"]`);
      const ok = isDone(si, ii); if (ok) d++;
      el.classList.toggle('done', ok);
      const id = idOf(si, ii);
      const t = el.querySelector('.t'); const tag = t.querySelector('.local');
      if (id in local && local[id] !== it.done) { if (!tag) t.insertAdjacentHTML('beforeend', '<span class="local">(tạm)</span>'); } else if (tag) tag.remove();
      const text = el.textContent.toLowerCase();
      const vis = (state.lv === 'all' || it.level === state.lv) && (!state.q || text.includes(state.q)) && !(state.hideDone && ok);
      el.classList.toggle('hide', !vis); if (vis) { shown++; gShown[it.g] = 1; }
      if (!ok && by[it.level] !== undefined) by[it.level]++;
    });
    document.querySelector(`#s${si} .empty`).style.display = shown ? 'none' : 'block';
    document.querySelectorAll(`.grp[data-s="${si}"]`).forEach(g => g.classList.toggle('hide', !gShown[g.dataset.g]));
    const pct = Math.round(d / s.items.length * 100);
    $('#p' + si).textContent = `${d}/${s.items.length} · ${pct}%`;
    $('#b' + si).style.width = pct + '%';
    all += s.items.length; done += d;
  });
  $('#total-bar').style.width = (all ? done / all * 100 : 0) + '%';
  $('#stats').innerHTML = [[done + '/' + all, 'Đã xong'], [by.low, 'Còn lại · Thấp'], [by.mid, 'Còn lại · Vừa'], [by.high, 'Còn lại · Cao']]
    .map(([n, l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
}

document.addEventListener('click', e => {
  const c = e.target.closest('.check');
  if (c) { const it = c.closest('.item'), si = +it.dataset.s, ii = +it.dataset.i, id = idOf(si, ii);
    const next = !isDone(si, ii); if (next === DOC.sections[si].items[ii].done) delete local[id]; else local[id] = next; save(); refresh(); return; }
  const lv = e.target.closest('[data-lv]');
  if (lv && lv.classList.contains('chipbtn')) { state.lv = lv.dataset.lv; document.querySelectorAll('.chipbtn[data-lv]').forEach(b => b.classList.toggle('on', b === lv)); refresh(); }
});
$('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); refresh(); });
$('#hide-done').addEventListener('click', e => { state.hideDone = !state.hideDone; e.target.classList.toggle('on', state.hideDone); refresh(); });
$('#theme').addEventListener('click', () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
refresh();
</script>
