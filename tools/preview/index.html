<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniCar Preview</title>
<!--
  Ban xem truoc DUY NHAT cua OmniCar (mo bang trinh duyet): giao dien chung, logo, Cai dat va man xe cua moi tinh nang.
  Thu o day truoc roi moi sua code. Moi tab la mot trang doc lap trong <template id="m-..."> ben duoi (HTML / CSS / JS
  rieng, chay trong iframe nen khong de len nhau); sua thang trong template do. Mo thang mot tab: index.html#bubble.
  Tab: #overview #logo #home #split #settings #bubble #startup #keyboard. Anh dung duong dan tuong doi tu thu muc nay
  (../../assets, ../../Prefs/Resources).
-->
<style>
:root { --page: #eceef7; --ink: #1f2233; --ink2: #6b7090; --main: linear-gradient(135deg, #9B87F8, #5DB4F6); }
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); background: var(--page); font: 14px/1.45 "HarmonyOS Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px;
  background: rgba(236,238,247,.82); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
  box-shadow: 0 1px 0 rgba(31,34,51,.08); }
header b { font-size: 16px; white-space: nowrap; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { padding: 6px 12px; border-radius: 16px; color: var(--ink); text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; }
nav a:hover { background: rgba(120,120,140,.12); }
nav a.on { background: var(--main); color: #fff; box-shadow: 0 4px 12px rgba(110,120,245,.35); }
#desc { margin: 10px 16px 0; color: var(--ink2); font-size: 12.5px; text-align: center; }
iframe { display: block; width: 100%; height: 600px; border: 0; }
</style>
</head>
<body>
<header><b>OmniCar · xem trước</b><nav id="nav"><a href="#overview" data-k="overview">Tổng quan</a><a href="#logo" data-k="logo">Logo</a><a href="#home" data-k="home">Màn xe & App</a><a href="#split" data-k="split">Chia màn hình</a><a href="#settings" data-k="settings">Cài đặt tính năng</a><a href="#bubble" data-k="bubble">Bong bóng tốc độ</a><a href="#startup" data-k="startup">Khởi động</a><a href="#keyboard" data-k="keyboard">Bàn phím</a></nav></header>
<p id="desc"></p>
<main id="main"></main>

<!-- ===================================================================== Tổng quan (#overview) ===================================================================== -->
<template id="m-overview" data-name="Tổng quan" data-desc="Bảng màu, quy tắc giao diện, trang Cài đặt chính, chia màn hình, thanh •••, bảng chọn app, bàn phím, màn khởi động mặc định.">
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniCar Theme</title>
<!--
  Giao dien moi cua toan bo OmniCar: HarmonyOS sang + chat long 3D / kinh mo (logo D trong tools/preview/logo.html).
  Nen chat long pastel (oai huong, xanh troi, bac ha, dao), bang / thanh / phim la kinh trang mo, dang chon = gradient
  tim -> xanh troi co quang mau. Giu: cong tac bat xanh la, dau X dong mau do, chuyen dong HarmonyOS, bo cuc ban phim
  HarmonyOS. Xem truoc truoc khi sua code (Settings, Split Screen, App Bridge, ban phim, Speed Bubble, Startup Screen).
-->
<style>
:root {
  --page: #eceef7; --ink: #1f2233; --ink2: #6b7090; --line: rgba(31,34,51,.08);
  --lav: #B7A6FF; --sky: #8FD3FF; --mint: #9DF2D8; --peach: #FFC2D6;
  --acc1: #8B7CFF; --acc2: #5AB8FF; --acc: linear-gradient(135deg, var(--acc1), var(--acc2)); --acc-glow: 0 6px 18px rgba(110,120,255,.45);
  --on: #34C759; --danger: #FF5A5F;
  /* Trong cac bang nen logo (man xe): 1 bo quy tac cho vien / o / dang chon / icon, khong dung vien den
     o (tile)  = kinh trang trong + vien trang 1px nhu dia trong logo
     khung o   = vien trang 1.5px (giong vanh trang cua dia + tam giac trong logo)
     dang chon = o trang dac + vien cau vong 4 mau logo (tim, xanh troi, bac ha, hong) + quang tim nhat
     nut chinh = gradient tim -> xanh troi dam hon nen mot bac, icon trang;  dong = X do tren o thuong */
  --mk: #4a4f80; --mk2: rgba(74,79,128,.55);
  --tile: rgba(255,255,255,.5); --tile-fx: inset 0 0 0 1px rgba(255,255,255,.9), 0 2px 6px rgba(110,100,200,.12);
  --slot: rgba(255,255,255,.45); --slot-fx: inset 0 0 0 1.5px rgba(255,255,255,.95);
  --aurora: conic-gradient(from 210deg, #A78BFA, #60C5FA, #5EDDB6, #F59AC0, #A78BFA);
  --sel-fx: 0 6px 16px rgba(130,115,240,.28);
  --main: linear-gradient(135deg, #9B87F8, #5DB4F6); --main-fx: 0 5px 14px rgba(110,120,245,.4);
  --glass: rgba(255,255,255,.4); --glass-strong: rgba(255,255,255,.78); --glass-rim: rgba(255,255,255,.85);
  --glass-shadow: 0 10px 30px rgba(70,60,140,.18), 0 1px 2px rgba(70,60,140,.08);
  --hm-in: cubic-bezier(.2, 0, .2, 1); --hm-spring: cubic-bezier(.25, 1.35, .45, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); font: 14px/1.45 "HarmonyOS Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
body { background: radial-gradient(1200px 600px at 10% -10%, #e4ddff, transparent 60%), radial-gradient(1000px 600px at 100% 10%, #d6f1ff, transparent 60%), var(--page);
  padding: 22px 16px 60px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }
h2 { margin: 0; font-size: 16px; }
.sub { color: var(--ink2); margin: -16px 0 0; text-align: center; max-width: 900px; }
section { width: 100%; max-width: 1200px; display: flex; flex-direction: column; gap: 12px; }
section > p { margin: -6px 0 0; color: var(--ink2); font-size: 13px; }
.row { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }

/* ---------- Kinh + chat long dung chung ---------- */
.liquid { position: absolute; inset: 0; overflow: hidden; background: #f1f0fb; }
.liquid i { position: absolute; border-radius: 50%; filter: blur(40px); opacity: .9; animation: drift 14s ease-in-out infinite alternate; }
.liquid i:nth-child(1) { background: var(--lav); width: 60%; height: 80%; left: -12%; top: -25%; }
.liquid i:nth-child(2) { background: var(--sky); width: 55%; height: 75%; right: -10%; top: -10%; animation-delay: -4s; }
.liquid i:nth-child(3) { background: var(--mint); width: 50%; height: 70%; right: 5%; bottom: -35%; animation-delay: -8s; }
.liquid i:nth-child(4) { background: var(--peach); width: 45%; height: 65%; left: 5%; bottom: -30%; animation-delay: -2s; }
@keyframes drift { to { transform: translate(6%, 5%) scale(1.08); } }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
  box-shadow: inset 0 1px 0 var(--glass-rim), inset 0 0 0 1px rgba(255,255,255,.45), var(--glass-shadow); }
/* Cac bang hien ra tren man xe (khay bo cuc, thanh ti le, thanh hanh dong, thong bao, bang chon app, ban phim):
   nen phoi mau giong nen logo OmniCar - 4 goc tim oai / xanh troi / hong / bac ha (lay mau tu assets/icon-1024.png),
   hoi trong de van thay kinh mo, khong bi mau app ben duoi (nhac tim, video do) nhuom lai */
.tray.glass, .rbar.glass, .abar.glass, .toast.glass, .picker.glass, .kb.glass {
  background: radial-gradient(circle at 0 0, rgba(201,186,252,.95), transparent 70%), radial-gradient(circle at 100% 0, rgba(166,221,253,.95), transparent 70%),
    radial-gradient(circle at 0 100%, rgba(254,196,216,.95), transparent 70%), radial-gradient(circle at 100% 100%, rgba(160,241,217,.95), transparent 70%),
    rgba(232,234,250,.8);
  box-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.7), 0 12px 32px rgba(110,100,200,.25); color: var(--mk);
}

/* ---------- Bang mau ---------- */
.pal { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.sw { border-radius: 16px; overflow: hidden; background: #fff; box-shadow: var(--glass-shadow); font-size: 12px; }
.sw i { display: block; height: 58px; }
.sw div { padding: 8px 10px; } .sw b { display: block; font-size: 13px; } .sw span { color: var(--ink2); }

/* ---------- Dien thoai: Settings ---------- */
.phone { width: 340px; height: 700px; border-radius: 44px; background: #0c0d12; padding: 10px; box-shadow: 0 24px 60px rgba(40,30,90,.3); }
.scr { position: relative; width: 100%; height: 100%; border-radius: 35px; overflow: hidden; background: #f4f5fb; }
.scr .liquid { height: 300px; bottom: auto; }
.scr .liquid::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 40%, #f4f5fb); }
.st { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; justify-content: space-between; align-items: center; padding: 6px 26px 0; font-size: 13px; font-weight: 600; z-index: 3; }
.page { position: absolute; inset: 40px 0 0; overflow: hidden; padding: 0 14px; z-index: 2; }
.nav { height: 40px; display: flex; align-items: center; justify-content: space-between; }
.nav .back { font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 2px; }
.nav .t { font-weight: 600; font-size: 15px; }
.nav .ic { width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
.big { font-size: 28px; font-weight: 700; margin: 2px 4px 10px; }
.hero { border-radius: 24px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.hero svg { width: 58px; height: 58px; flex: none; filter: drop-shadow(0 6px 12px rgba(90,80,170,.3)); }
.hero .n { font-weight: 700; font-size: 18px; } .hero .s { font-size: 12px; color: var(--ink2); }
.hero .dot { display: inline-block; width: 7px; height: 7px; border-radius: 4px; background: var(--on); margin-right: 5px; box-shadow: 0 0 6px var(--on); }
.hero .grow { flex: 1; }
.lbl { font-size: 12px; color: var(--ink2); margin: 0 8px 6px; }
.card { border-radius: 20px; margin-bottom: 14px; overflow: hidden; }
.r { display: flex; align-items: center; gap: 11px; padding: 10px 12px; min-height: 50px; position: relative; }
.r + .r::before { content: ""; position: absolute; left: 54px; right: 0; top: 0; height: 1px; background: var(--line); }
.r .tile { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(90,80,170,.25); }
.r .tile svg { width: 17px; height: 17px; }
.r .lab { flex: 1; font-size: 15px; } .r .lab small { display: block; font-size: 11.5px; color: var(--ink2); }
.r .val { color: var(--ink2); font-size: 14px; }
.chev { color: #b4b8cc; font-size: 18px; margin-left: 2px; }
.swi { width: 46px; height: 28px; border-radius: 14px; background: rgba(120,120,140,.22); position: relative; flex: none; }
.swi::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.2); transition: transform .3s var(--hm-spring); }
.swi.on { background: var(--on); } .swi.on::after { transform: translateX(18px); }
.mini { width: 54px; height: 32px; border-radius: 8px; display: flex; gap: 3px; padding: 3px; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px rgba(31,34,51,.06); }
.mini i { flex: 1; border-radius: 5px; }
.foot { border-radius: 20px; padding: 14px; display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink2); }
.foot .al { width: 48px; height: 48px; border-radius: 12px; display: block; box-shadow: 0 4px 10px rgba(31,34,51,.2); }   /* logo AL goc (Prefs/Resources/avatar.png), khong ve lai */
.foot b { color: var(--ink); font-size: 14px; display: block; }

/* ---------- Man xe ---------- */
.car { width: 1120px; max-width: 100%; border-radius: 22px; background: #050506; padding: 12px; box-shadow: 0 24px 60px rgba(40,30,90,.3); }
.carfit { position: relative; width: 100%; aspect-ratio: 640 / 240; border-radius: 12px; overflow: hidden; container-type: inline-size; }
.cs { position: absolute; left: 0; top: 0; width: 640px; height: 240px; transform-origin: 0 0; transform: scale(calc(100cqw / 640px)); }
.cs { transform: scale(var(--k, 1.72)); }
.dock { position: absolute; left: 0; top: 0; bottom: 0; width: 45px; display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 6px; z-index: 4;
  background: #101114; color: #fff; }
.dock .t { font-size: 10px; font-weight: 700; }
.dock .d { width: 30px; height: 30px; border-radius: 8px; }
.dock .sp { flex: 1; }
.dock .split { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--mk);   /* nut Split Screen: o nen logo 4 mau nhu cac bang, cung co voi icon app tren dock */
  background: radial-gradient(circle at 0 0, #C9BAFC, transparent 75%), radial-gradient(circle at 100% 0, #A6DDFD, transparent 75%), radial-gradient(circle at 0 100%, #FEC4D8, transparent 75%), radial-gradient(circle at 100% 100%, #A0F1D9, transparent 75%), #E2E4F6;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.85), 0 2px 8px rgba(130,115,240,.35); }
.dock .split svg { width: 19px; height: 19px; }   /* cung glyph Chia man hinh (HM_SPLIT) cua thanh ••• */
.dock .g { width: 18px; height: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; } .dock .g i { background: #c9cdd4; border-radius: 1px; }
.area { position: absolute; left: 45px; top: 0; right: 0; bottom: 0; }
.pane { position: absolute; top: 0; bottom: 0; overflow: hidden; border-radius: 10px; }
.map { background: linear-gradient(160deg, #eef0e4, #dde9d6 40%, #d3e3ef); }
.map::before { content: ""; position: absolute; left: -20px; right: -20px; top: 120px; height: 7px; background: #fff; transform: rotate(-9deg); box-shadow: 0 0 0 1px #d0d4cf; }
.map::after { content: ""; position: absolute; left: 90px; width: 7px; top: -10px; bottom: -10px; background: #fff; box-shadow: 0 0 0 1px #d0d4cf; }
.music { background: linear-gradient(160deg, #3a2f6b, #1f2a4f); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; }
.music .art { width: 74px; height: 74px; border-radius: 12px; background: linear-gradient(135deg, #ff9a9e, #a18cd1); box-shadow: 0 8px 20px rgba(0,0,0,.35); }
.yt { background: #121212; }
.yt::before { content: ""; position: absolute; inset: 28px 10px 50px; border-radius: 8px; background: linear-gradient(135deg, #5b3c88, #c0396b); }
.divider { position: absolute; top: 0; bottom: 0; width: 6px; display: grid; place-items: center; z-index: 3; }
.divider i { width: 14px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.35); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.95), 0 2px 8px rgba(70,60,140,.3); position: relative; }
.divider i::after { content: ""; position: absolute; left: 5px; top: 5px; width: 4px; height: 4px; border-radius: 2px; background: var(--ink); }   /* cham tron kinh mo, cham giua mau muc */
/* thanh nut cua o */
/* tay cam ••• cua o + thanh hanh dong */
.handle { position: absolute; top: 5px; width: 40px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; gap: 3px; z-index: 5; }
.handle i { width: 4px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .85; }
.handle.glass { background: rgba(255,255,255,.35); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.55); }   /* vien bau duc trong */
.handle.open { background: var(--main); box-shadow: var(--main-fx); } .handle.open i { background: #fff; opacity: 1; }
/* Thanh hanh dong kieu HarmonyOS: vien kinh, o kinh tron 40pt chi icon 22pt (khong nhan), cham = nen mo */
.abar { position: absolute; height: 52px; border-radius: 22px; padding: 0 6px; display: flex; align-items: center; gap: 0; z-index: 6; animation: drop .4s var(--hm-spring) both; }
@keyframes drop { from { opacity: 0; translate: 0 -8px; scale: .94; } }
.act { width: 48px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--mk); cursor: pointer; transition: transform .25s var(--hm-spring); }
.act i { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; background: var(--tile); box-shadow: var(--tile-fx); transition: background .15s; }   /* o kinh tron nhu nut X cua khay, to hon */
.act:active, .act.press { transform: scale(.92); } .act:active i, .act.press i { background: #fff; }
.act svg { width: 22px; height: 22px; }
.act.x { color: var(--danger); }
.abar .sep { width: 1px; height: 30px; margin: 0 3px; background: rgba(255,255,255,.95); border-radius: 1px; }   /* tach nut Tat khoi cac nut con lai */
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 12.5px; color: var(--ink); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend svg { width: 22px; height: 22px; }
/* cua so noi (hinh trong hinh) + thong bao chay ngam */
.pip { position: absolute; right: 10px; bottom: 10px; width: 176px; height: 104px; border-radius: 14px; overflow: hidden; z-index: 5;
  box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 10px 26px rgba(40,30,90,.35); }
.pip .yt::before { inset: 22px 8px 10px; }
.toast { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); height: 34px; border-radius: 17px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 7px; font-size: 11.5px; z-index: 6; white-space: nowrap; }
.toast em { width: 22px; height: 22px; border-radius: 6px; display: block; }
.toast .open { height: 24px; padding: 0 10px; border-radius: 12px; display: grid; place-items: center; background: var(--main); color: #fff; font-weight: 600; box-shadow: var(--main-fx); }
/* thanh ti le */
.rbar { position: absolute; height: 34px; border-radius: 17px; display: flex; align-items: center; padding: 3px; gap: 3px; z-index: 5; }
.rbar span { height: 28px; width: 40px; border-radius: 14px; display: grid; place-items: center; color: var(--mk); position: relative; }
.rbar svg { width: 22px; height: 22px; }
/* Dang chon: nen trong suot cung mau bang, chi vien cau vong 2px (ve bang ::before + mask nen giua rong) + quang tim nhat */
.rbar span.sel, .tray .cell.sel { box-shadow: var(--sel-fx); }
.rbar span.sel::before, .tray .cell.sel::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; background: var(--aurora);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); pointer-events: none; }
/* khay bo cuc */
.tray { position: absolute; border-radius: 24px; padding: 10px; display: grid; gap: 6px; z-index: 6; }
.tray .tr { display: flex; align-items: center; gap: 4px; height: 56px; }
.tray .hd { width: 32px; display: grid; place-items: center; color: var(--mk2); }
.tray .hd svg { width: 18px; height: 18px; }
.tray .cell { width: 84px; height: 56px; border-radius: 14px; display: grid; place-items: center; position: relative; transition: transform .3s var(--hm-spring); background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.75); }   /* nen trong suot cung mau bang, vien trang manh tach tung bo cuc */
.lay { width: 72px; height: 40px; display: flex; gap: 3px; }
.lay i, .lay .col i { flex: 1; border-radius: 6px; background: var(--slot); box-shadow: var(--slot-fx); display: grid; place-items: center; }   /* vien trang quanh tung o */
.lay .col { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.lay img, .lay em { width: 18px; height: 18px; border-radius: 5px; display: block; }
.lay .plus { font-style: normal; color: var(--mk2); font-size: 14px; line-height: 18px; text-align: center; }
.cell.sel .lay i { background: rgba(255,255,255,.75); }   /* o cua bo cuc dang dung sang hon mot chut */
.tray .exit { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--danger); background: var(--tile); box-shadow: var(--tile-fx); margin-left: 6px; }
.tray .exit svg { width: 18px; height: 18px; }
/* bang chon app */
.picker { position: absolute; inset: 8px; border-radius: 24px; display: flex; gap: 10px; padding: 12px; z-index: 6; }
.pgrid { flex: 1; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 56px; gap: 6px; }
.papp { display: flex; align-items: center; justify-content: center; position: relative; }   /* khong khung: icon tran nhu man Home */
.papp em { width: 44px; height: 44px; border-radius: 12px; display: block; position: relative; box-shadow: 0 4px 10px rgba(110,100,200,.25); }
.papp.sel::before { content: ""; position: absolute; width: 54px; height: 54px; border-radius: 16px; background: var(--aurora); box-shadow: var(--sel-fx); }
.papp.sel em { box-shadow: 0 0 0 2.5px #fff; }   /* khe trang giua icon va vien cau vong */
.papp.dim { opacity: .35; }
.pinfo { width: 150px; display: flex; flex-direction: column; gap: 8px; }
.pinfo .x { align-self: flex-end; width: 32px; height: 32px; border-radius: 16px; display: grid; place-items: center; color: var(--danger); background: var(--tile); box-shadow: var(--tile-fx); }
.pinfo .x svg { width: 14px; height: 14px; }
.pinfo .mapx { flex: 1; border-radius: 14px; display: flex; gap: 4px; padding: 6px; background: transparent; }

<h1>OmniCar · giao diện mới (HarmonyOS sáng + kính chất lỏng)</h1>
<p class="sub">Áp phương án logo D cho toàn bộ tweak. Bảng trên màn xe nền phối màu như logo; ô kính trắng viền trắng như logo; đang chọn = viền cầu vồng 4 màu logo, nền trong; nút chính = gradient tím → xanh trời. Giữ: công tắc bật xanh lá, dấu X đóng màu đỏ, chuyển động HarmonyOS.</p>

<section>
  <h2>1 · Bảng màu</h2>
  <div class="pal" id="pal"></div>
  <div class="card glass" style="padding:12px 16px;font-size:13px;line-height:1.7">
    <b>Quy tắc chung (mọi phần dùng cùng):</b><br>
    · <b>Kính mờ</b> cho bảng / thanh / thẻ / phím: trắng ~40% + mờ 22 (nhìn xuyên, không trắng đục), viền sáng trên, bóng tím nhạt.<br>
    · <b>Bo góc</b>: bảng lớn 24 (khay bố cục, bảng chọn app; thẻ Settings 20; bàn phím 20, bo cả 4 góc) · thanh = viên thuốc · ô bố cục 14 · phím 7 · nút tròn.<br>
    · <b>Bảng trên màn xe</b> (khay bố cục, thanh tỉ lệ, thanh •••, thông báo, bảng chọn app, bàn phím): nền phối 4 màu như nền logo, viền trắng 1px.<br>
    · <b>Ô</b> trong bảng (ô bố cục, ô app, nút X, phím chức năng) = kính trắng trong + viền trắng 1px như đĩa trong logo; <b>khung từng ô</b> = viền trắng 1,5px như vành trắng của logo; không dùng viền đen.<br>
    · <b>Chấm tròn vạch chia</b> khi chạm / kéo / mở thanh tỉ lệ = gradient tím → xanh trời + chấm trắng + quầng tím như tay cầm ••• đang mở. <b>Đang chọn</b> = nền trong cùng màu bảng + viền cầu vồng 4 màu logo (tím, xanh trời, bạc hà, hồng) + quầng tím nhạt (bố cục đang dùng, tỉ lệ đang dùng, app đang chọn). <b>Nút chính</b> = gradient tím → xanh trời, icon trắng (tay cầm ••• đang mở, Enter, Mở lại, ô đang chọn cho app).<br>
    · <b>Đóng / Tắt</b> = dấu X đỏ trên nền đỏ nhạt, luôn ở cuối, tách bằng vạch mảnh. <b>Công tắc bật</b> = xanh lá.<br>
    · <b>Icon</b> màu chàm dịu #4A4F80 (icon phụ 55%), nét mảnh bo tròn 1,5, cỡ 22 trên thanh ••• (ô kính tròn 40pt, không nhãn), 18 trong khay; trên màn xe chỉ icon, không chữ chú thích.<br>
    · <b>Chuyển động</b>: hiện = lò xo HarmonyOS (thu 0,94 → 1, thả xuống 8 pt), ẩn = trượt / mờ 250 ms; bảng trên xe tự đóng sau 4 s không chạm.

</section>

function tri(cx, cy, h, r) {
  const w = h * .9, p = [[cx - w / 2 + w / 6, cy - h / 2], [cx - w / 2 + w / 6, cy + h / 2], [cx + w / 2 + w / 6, cy]];
  let d = '';
  for (let i = 0; i < 3; i++) {
    const pr = p[(i + 2) % 3], cu = p[i], nx = p[(i + 1) % 3];
    let ax = pr[0] - cu[0], ay = pr[1] - cu[1], bx = nx[0] - cu[0], by = nx[1] - cu[1];
    const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by); ax /= la; ay /= la; bx /= lb; by /= lb;
    const th = Math.acos(Math.max(-1, Math.min(1, ax * bx + ay * by))), dd = r / Math.tan(th / 2);

.cell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
.cell .ic { display: grid; place-items: center; color: #fff; font-weight: 700; box-shadow: 0 4px 12px rgba(0,0,0,.35); transition: width .25s, height .25s, border-radius .25s; }
.cell .nm { color: #fff; font-size: 12px; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.pdots { position: absolute; left: 64px; right: 0; bottom: 8px; display: flex; justify-content: center; gap: 6px; z-index: 2; }
.pdots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.4); cursor: pointer; }
.pdots i.on { width: 16px; background: #fff; }
.legend { border-radius: 18px; padding: 12px 16px; font-size: 12.5px; line-height: 1.7; }
.note { font-size: 12.5px; color: var(--ink2); }
.note b { color: var(--ink); }
</style>
</head>
<body>
<h1>Màn xe · App trên màn xe + Màn chính CarPlay</h1>
<p class="sub">Nhóm <b>Màn xe</b> ở trang chính có 2 mục. <b>App trên màn xe</b>: cắm xe thì CarPlay hiện app như đã chọn trong Cài đặt iPhone › CarPlay;
  bật <b>Tùy chỉnh danh sách app</b> thì OmniCar thay danh sách đó (ẩn / hiện từng app CarPlay; Điện thoại, Nhạc, Bản đồ, Tin nhắn, Đang phát, Cài đặt khoá như CarPlay).
  Một danh sách chia 2 phần: <b>App CarPlay</b> và <b>App Bridge</b> (app iPhone đưa lên xe). <b>Màn chính CarPlay</b>: lưới icon (số cột, số hàng, cỡ icon, tên app) và hình nền.</p>

<div class="wrap">
  <div class="phone"><div class="scr"><div class="liquid"><i></i><i></i><i></i><i></i></div>
    <div class="st"><span>9:41</span><span>●●● 5G ▮</span></div>
    <div class="page" id="page"></div>
  </div></div>

  <div class="right">
    <div class="car"><div class="carfit" id="fit"><div class="cs" id="cs"></div></div></div>
    <div class="legend glass" id="sum"></div>
    <div class="note"><b>Ghi chú:</b> trên xe ẩn app qua hook <code>-[SBIconModel isIconVisible:]</code> (chỉ bỏ icon, app vẫn tự mở khi có cuộc gọi / chỉ đường / Siri);
      thử rồi Gửi log (dòng "HomeScreen:"). Bản xem trước: video là gradient chuyển động.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const I = (d, w = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  back: I('<path d="M15 5l-7 7 7 7"/>', 2.2),
  grid: I('<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>', 2),
  palette: I('<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.5 1.6-1.5h2.1a4 4 0 0 0 4-4c0-4-3.8-7.2-8.5-7.2z"/><circle cx="7.8" cy="11" r="1"/><circle cx="10.5" cy="7.3" r="1"/><circle cx="15" cy="7.8" r="1"/>', 1.8),
  size: I('<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M9 15l6-6M15 13V9h-4"/>', 2),
  photo: I('<rect x="3.5" y="5" width="17" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 3 2.5 3-2.5 5 4"/>', 2),
  blur: I('<circle cx="12" cy="12" r="8"/><path d="M12 4v16M8 5.2v13.6M16 5.2v13.6" stroke-opacity=".5"/>', 2),
  moon: I('<path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/>', 2),
  iphone: I('<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/>', 2.6),
  sliders: I('<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>', 2),
  lock: I('<rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>', 2),
  play: I('<path d="M8 5.5v13l11-6.5z"/>', 2),
  cols: I('<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M9.2 5v14M14.8 5v14"/>', 2),
  rows: I('<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M3.5 12h17"/>', 2),
  text: I('<path d="M5 7V5.5h14V7M12 5.5v13M9 18.5h6"/>', 2),
};
const tile = (svg, c) => `<span class="tile" style="background:${c}">${svg}</span>`;

// App CarPlay theo thu tu xe; lock = CarPlay khong cho an (HSIsLockedCarPlayApp)
const CARPLAY = [
  { id: 'maps', n: 'Bản đồ', c: 'linear-gradient(160deg,#6fd36b,#2e9cf5)', g: '➤', lock: true },
  { id: 'music', n: 'Nhạc', c: 'linear-gradient(160deg,#ff6b81,#fa2d55)', g: '♫', lock: true },
  { id: 'phone', n: 'Điện thoại', c: 'linear-gradient(160deg,#5be37d,#2fbf55)', g: '✆', lock: true },
  { id: 'msg', n: 'Tin nhắn', c: 'linear-gradient(160deg,#6ef08a,#2fc25a)', g: '✉', lock: true },
  { id: 'now', n: 'Đang phát', c: 'linear-gradient(160deg,#ff8a65,#ff3d71)', g: '▶︎', lock: true },
  { id: 'podcast', n: 'Podcast', c: 'linear-gradient(160deg,#d38bff,#8a3df0)', g: '◉' },
  { id: 'books', n: 'Sách', c: 'linear-gradient(160deg,#ffb84d,#ff8a00)', g: '▤' },
  { id: 'spotify', n: 'Spotify', c: '#1db954', g: 'S' },
  { id: 'gmaps', n: 'Google Maps', c: 'linear-gradient(160deg,#fff,#e9eef5)', g: '<span style="color:#ea4335">G</span>' },
  { id: 'waze', n: 'Waze', c: '#33ccff', g: 'W' },
  { id: 'vietmap', n: 'Vietmap', c: '#f07a12', g: 'V' },
  { id: 'settings', n: 'Cài đặt', c: 'linear-gradient(160deg,#9aa0a8,#636a73)', g: '⚙', lock: true },
];
const PHONE = [
  { id: 'youtube', n: 'YouTube', c: '#ff2a20', g: '▶' },
  { id: 'tiktok', n: 'TikTok', c: '#111', g: '♪' },
  { id: 'zing', n: 'Zing MP3', c: '#6a3df0', g: 'Z' },
  { id: 'facebook', n: 'Facebook', c: '#1877f2', g: 'f' },
  { id: 'netflix', n: 'Netflix', c: '#111', g: '<span style="color:#e50914">N</span>' },
  { id: 'safari', n: 'Safari', c: 'linear-gradient(160deg,#5ac8fa,#1f7bff)', g: '◎', sys: true },
  { id: 'photos', n: 'Ảnh', c: '#fff', g: '<span style="color:#ff9500">✿</span>', sys: true },
];
const byId = Object.fromEntries([...CARPLAY, ...PHONE].map(a => [a.id, a]));
const WALL_NAMES = ['Mặc định', 'Đại dương', 'Hoàng hôn', 'OmniCar', 'Đêm', 'Bình minh', 'Rừng', 'Ảnh của bạn', 'Video của bạn'];
const WALLS = [
  null,
  'linear-gradient(160deg,#1e3c72,#2a5298 45%,#6dd5ed)',
  'radial-gradient(circle at 30% 20%,#f9d29d,transparent 50%),linear-gradient(160deg,#ff9a8b,#a18cd1 55%,#2b1055)',
  'radial-gradient(circle at 70% 30%,#c9baff,transparent 45%),radial-gradient(circle at 20% 80%,#a0f1d9,transparent 45%),linear-gradient(135deg,#a6ddfd,#fec4d8)',
  'linear-gradient(180deg,#0f2027,#203a43 50%,#2c5364)',
  'radial-gradient(circle at 50% 120%,#ff7e5f,transparent 55%),linear-gradient(180deg,#0b1026,#2a1a4a)',
  'linear-gradient(160deg,#134e5e,#71b280)',
  'radial-gradient(circle at 25% 35%,#ffd8a8,transparent 40%),linear-gradient(160deg,#6a85b6,#bac8e0)',
  'linear-gradient(120deg,#ff7eb3,#7afcff,#feff9c,#ff7eb3)',
];

const S = {
  view: 'apps',                                    // root / apps / layout (mo thang trang App)
  custom: false, q: '',                            // Tuy chinh danh sach app (HS_KEY_CUSTOM_APPS), o tim
  onCar: new Set(['youtube', 'tiktok', 'zing']),   // AB_KEY_APPS
  hidden: new Set(['books']),                      // HS_KEY_HIDDEN_APPS
  size: 100, cols: 0, rows: 0, names: true,          // cols / rows 0 = Tu dong (HS_COLS_VALUES / HS_ROWS_VALUES)
  wall: 2, blur: 0, dark: 25, hasPhoto: false, wallOpen: true, page: 0,
};
const hides = id => S.custom && S.hidden.has(id) && !byId[id].lock;   // an chi khi Tuy chinh bat
const visibleCarPlay = () => CARPLAY.filter(a => !hides(a.id));
const onCarItems = () => [...visibleCarPlay(), ...PHONE.filter(a => S.onCar.has(a.id))];

// ---------- trang Cai dat ----------
function rootPage() {
  return `<div class="nav"></div><div class="big">OmniCar</div>
    <div class="lbl">Màn xe</div>
    <div class="card glass">
      <div class="r" data-go="apps">${tile(ICON.grid, 'linear-gradient(135deg,#8FD3FF,#5AB8FF)')}<span class="lab">App trên màn xe</span><span class="val">${S.onCar.size ? S.onCar.size + ' app' : 'Không'}</span><span class="chev">›</span></div>
      <div class="r" data-go="layout">${tile(ICON.palette, 'linear-gradient(135deg,#FFC2D6,#FF7FA8)')}<span class="lab">Màn chính CarPlay</span><span class="chev">›</span></div>
    </div>
    <div class="foot">Chạm một mục để mở. Các nhóm Tính năng, Hồ sơ xe, Hỗ trợ: xem tab Tổng quan.</div>`;
}
function navBar(title) { return `<div class="nav"><span class="back" data-go="root">${ICON.back}OmniCar</span><span class="t">${title}</span></div>`; }

function appsPage() {
  const grid = onCarItems().map(a => `<div><span class="ico" style="background:${a.c}">${a.g}${byId[a.id] && PHONE.includes(a) ? `<span class="badge">${ICON.iphone}</span>` : ''}</span><span>${a.n}</span></div>`).join('');
  const q = S.q.trim().toLowerCase(), match = a => !q || a.n.toLowerCase().includes(q);
  // Tuy chinh tat: app CarPlay theo dung Cai dat iPhone > CarPlay, cong tac chi de xem (mo)
  const cp = CARPLAY.filter(match).map(a => `<div class="r"><span class="ico" style="background:${a.c}">${a.g}</span>
      <span class="lab">${a.n}${a.lock ? '<small class="sys">CarPlay luôn hiện</small>' : ''}</span>
      ${a.lock ? `<span class="lock">${ICON.lock}</span>` : `<span class="swi ${hides(a.id) ? '' : 'on'} ${S.custom ? '' : 'dis'}" data-hide="${a.id}"></span>`}</div>`).join('');
  const ip = PHONE.filter(match).map(a => `<div class="r"><span class="ico" style="background:${a.c}">${a.g}</span>
      <span class="lab">${a.n}${a.sys ? '<small class="sys">Hệ thống</small>' : ''}</span>
      <span class="swi ${S.onCar.has(a.id) ? 'on' : ''}" data-car="${a.id}"></span></div>`).join('');
  const nCp = CARPLAY.filter(match).length, nIp = PHONE.filter(match).length;
  return navBar('App trên màn xe') + `
    <div class="lbl">Đang hiện trên xe · ${onCarItems().length}</div>
    <div class="card glass"><div class="oncar">${grid}</div></div>
    <div class="foot">App có dấu iPhone là app iPhone đưa lên xe qua App Bridge.</div>
    <div class="lbl">Chọn app</div>
    <div class="card glass">
      <div class="r"><span class="tile" style="background:linear-gradient(135deg,#B7A6FF,#8B7CFF)">${ICON.sliders}</span><span class="lab">Tùy chỉnh danh sách app</span><span class="swi ${S.custom ? 'on' : ''}" data-custom></span></div>
      <input class="find" placeholder="Tìm app" value="${S.q}" data-find>
      <div class="list" id="applist">
        ${nCp ? `<div class="ph">App CarPlay · ${nCp}</div>${cp}` : ''}
        ${nIp ? `<div class="ph">App Bridge · ${nIp}</div>${ip}` : ''}
        ${!nCp && !nIp ? '<div class="r"><span class="lab" style="color:var(--ink2)">Không có app nào khớp.</span></div>' : ''}
      </div>
    </div>
    <div class="foot">${S.custom ? 'Tắt một app CarPlay để ẩn icon của nó trên màn chính của xe. Chỉ ẩn icon: app vẫn tự mở khi có cuộc gọi, chỉ đường hoặc Siri.'
      : 'Đang tắt: xe hiện app CarPlay như đã chọn trong Cài đặt iPhone › Cài đặt chung › CarPlay. Bật để ẩn / hiện từng app CarPlay ở đây.'}<br>
      Bật app để icon hiện trên màn chính CarPlay qua App Bridge. App đã có CarPlay riêng không nằm ở đây.</div>`;
}

function layoutPage() {
  const slider = (k, min, max, unit, label, ic, c) => `<div class="r">${tile(ICON[ic], c)}<span class="lab" style="flex:none;width:92px">${label}</span>
      <input type="range" min="${min}" max="${max}" value="${S[k]}" data-range="${k}"><span class="val" id="v-${k}">${S[k]}${unit}</span></div>`;
  const tiles = WALLS.map((w, i) => {
    if (i === 7 && !S.hasPhoto) return '';
    return `<div class="${i === 0 ? 'none' : ''} ${i === 8 ? 'vid' : ''} ${S.wall === i ? 'sel' : ''}" data-wall="${i}" style="${w ? 'background:' + w : ''}">${i === 0 ? 'Mặc định' : ''}${i === 8 ? ICON.play : ''}</div>`;
  }).join('');
  const COLS = [0, 3, 4, 5, 6, 7, 8], ROWS = [0, 1, 2, 3, 4];
  const step = (k, vals, label, ic, c) => `<div class="r">${tile(ICON[ic], c)}<span class="lab">${label}</span>
      <span class="step"><span data-step="${k}" data-d="-1">−</span><b>${S[k] || 'Tự động'}</b><span data-step="${k}" data-d="1">+</span></span></div>`;
  return navBar('Màn chính CarPlay') + `
    <div class="mini"><div class="cs" id="cs2"></div></div>
    <div class="lbl">Lưới icon</div>
    <div class="card glass">
      ${step('cols', COLS, 'Số cột', 'cols', 'linear-gradient(135deg,#8FD3FF,#5AB8FF)')}
      ${step('rows', ROWS, 'Số hàng', 'rows', 'linear-gradient(135deg,#9DF2D8,#2BC79A)')}
      ${slider('size', 60, 130, '%', 'Cỡ icon', 'size', 'linear-gradient(135deg,#B7A6FF,#8B7CFF)')}
      <div class="r">${tile(ICON.text, 'linear-gradient(135deg,#FFC2D6,#FF7FA8)')}<span class="lab">Tên app</span><span class="swi ${S.names ? 'on' : ''}" data-names></span></div>
    </div>
    <div class="foot">Tự động = số cột / hàng của CarPlay. Cỡ icon 100 % là cỡ của CarPlay; nhiều cột / hàng hơn thì giảm cỡ icon cho tên không chồng nhau.</div>
    <div class="card glass fold ${S.wallOpen ? 'open' : ''}">
      <div class="r" data-fold>${tile(ICON.photo, 'linear-gradient(135deg,#FFB86B,#FF7FA8)')}<span class="lab">Hình nền</span><span class="val">${WALL_NAMES[S.wall]}</span><span class="chev">›</span></div>
      ${S.wallOpen ? `<div class="wps">${tiles}</div><div class="pbtn" data-photos>Từ Ảnh (ảnh hoặc video)</div>
        ${slider('blur', 0, 30, '', 'Độ mờ', 'blur', 'linear-gradient(135deg,#B7A6FF,#5AB8FF)')}
        ${slider('dark', 0, 70, '%', 'Độ tối', 'moon', 'linear-gradient(135deg,#8a8fb0,#4a4f80)')}` : ''}
    </div>
    ${S.wallOpen ? '<div class="foot">Ảnh được cắt theo màn xe; tăng độ tối để icon dễ đọc. Video lặp lại không tiếng (20 giây đầu), tự dừng khi máy nóng, bật chế độ nhẹ, đang chia màn hoặc có app che màn chính.</div>' : ''}`;
}

// ---------- man xe: luoi 5 x 2 cua CarPlay ----------
function carScreen() {
  const W = 800 - 64, items = onCarItems();
  const cols = S.cols || 5, rows = S.rows || 2, per = cols * rows, base = 64 * S.size / 100, cellW = (W - 24) / cols;
  const pages = Math.max(1, Math.ceil(items.length / per));
  S.page = Math.min(S.page, pages - 1);
  const cells = items.slice(S.page * per, S.page * per + per).map(a =>
    `<div class="cell" style="width:${cellW}px"><div class="ic" style="width:${base}px;height:${base}px;border-radius:${base * .225}px;background:${a.c};font-size:${base * .42}px">${a.g}</div>${S.names ? `<div class="nm">${a.n}</div>` : ''}</div>`).join('');
  const w = WALLS[S.wall];
  const html = `<div class="wall ${w ? '' : 'blank'} ${S.wall === 8 ? 'vid' : ''}" style="${w ? `background:${w};${S.wall === 8 ? '' : `filter:blur(${S.blur / 3}px);transform:scale(${1 + S.blur / 200})`}` : ''}"></div>
    <div class="dim" style="opacity:${w ? S.dark / 100 : 0}"></div>
    <div class="dock"><div class="t">9:41</div><div class="sig">●●● 5G</div>
      ${['music', 'phone'].map(id => `<div class="d" style="background:${byId[id].c}">${byId[id].g}</div>`).join('')}
      <div class="sp"></div><div class="home"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="grid" style="grid-template-columns:repeat(${cols}, ${cellW}px);row-gap:14px">${cells}</div>
    ${pages > 1 ? `<div class="pdots">${Array.from({ length: pages }, (_, i) => `<i class="${i === S.page ? 'on' : ''}" data-page="${i}"></i>`).join('')}</div>` : ''}`;
  $('cs').innerHTML = html;
  if ($('cs2')) { $('cs2').innerHTML = html; $('cs2').style.setProperty('--k', $('cs2').parentNode.clientWidth / 800); }
  const hid = CARPLAY.filter(a => hides(a.id)).map(a => a.n);
  $('sum').innerHTML = `<b>Trên xe:</b> ${visibleCarPlay().length} app CarPlay${hid.length ? ` (ẩn: ${hid.join(', ')})` : ''} + ${S.onCar.size} app iPhone ·
    lưới ${S.cols || 'tự động'} × ${S.rows || 'tự động'}, icon ${S.size}%${S.names ? '' : ', ẩn tên'} · hình nền ${WALL_NAMES[S.wall]}${w && S.wall !== 8 ? `, mờ ${S.blur}, tối ${S.dark}%` : w ? `, tối ${S.dark}%` : ''} · ${pages} trang.
    ${!hid.length && S.size === 100 && !S.cols && !S.rows && S.names && !S.wall ? ' Không ẩn app, lưới tự động, cỡ 100 %, có tên, hình nền Mặc định = màn chính CarPlay nguyên bản (chỉ thêm app iPhone).' : ''}`;
  document.querySelectorAll('[data-page]').forEach(e => e.onclick = () => { S.page = +e.dataset.page; carScreen(); });
}

// ---------- tuong tac ----------
function render() {
  const pg = $('page'), top = pg.scrollTop, lt = $('applist') ? $('applist').scrollTop : 0;
  pg.innerHTML = S.view === 'apps' ? appsPage() : S.view === 'layout' ? layoutPage() : rootPage();
  pg.scrollTop = top;
  if ($('applist')) $('applist').scrollTop = lt;
  bind();
  carScreen();
}
function bind() {
  const pg = $('page');
  pg.querySelectorAll('[data-go]').forEach(e => e.onclick = () => { S.view = e.dataset.go; $('page').scrollTop = 0; render(); });
  pg.querySelectorAll('[data-custom]').forEach(e => e.onclick = () => { S.custom = !S.custom; render(); });
  pg.querySelectorAll('[data-car]').forEach(e => e.onclick = () => { const id = e.dataset.car; S.onCar.has(id) ? S.onCar.delete(id) : S.onCar.add(id); render(); });
  pg.querySelectorAll('[data-hide]').forEach(e => e.onclick = () => { if (!S.custom) return; const id = e.dataset.hide; S.hidden.has(id) ? S.hidden.delete(id) : S.hidden.add(id); render(); });
  pg.querySelectorAll('[data-find]').forEach(e => e.oninput = () => { S.q = e.value; const pos = e.selectionStart; render(); const f = $('page').querySelector('[data-find]'); f.focus(); f.setSelectionRange(pos, pos); });
  pg.querySelectorAll('[data-range]').forEach(e => e.oninput = () => {
    S[e.dataset.range] = +e.value;
    $('v-' + e.dataset.range).textContent = e.value + (['size', 'dark'].includes(e.dataset.range) ? '%' : '');
    carScreen();
  });
  pg.querySelectorAll('[data-fold]').forEach(e => e.onclick = () => { S.wallOpen = !S.wallOpen; render(); });
  pg.querySelectorAll('[data-step]').forEach(e => e.onclick = () => {   // - / + qua danh sach gia tri, 0 = Tu dong
    const k = e.dataset.step, vals = k === 'cols' ? [0, 3, 4, 5, 6, 7, 8] : [0, 1, 2, 3, 4];
    S[k] = vals[Math.max(0, Math.min(vals.length - 1, vals.indexOf(S[k]) + +e.dataset.d))]; render();
  });
  pg.querySelectorAll('[data-names]').forEach(e => e.onclick = () => { S.names = !S.names; render(); });
  pg.querySelectorAll('[data-wall]').forEach(e => e.onclick = () => { S.wall = +e.dataset.wall; render(); });

// ---------------------------------------------------------------------------------------------
//  Popup chon app (buildPickerSheetForPane): luoi trai, cot phai (X + so do), chia trang, app da dung mo di
// ---------------------------------------------------------------------------------------------
function refreshPicker() {
  const waiting = S.mode === 'split' ? S.panes.filter(p => p.picking) : [];
  if (!waiting.length) { S.pickTarget = null; return removePicker(); }
  if (!waiting.some(p => p.id === S.pickTarget)) S.pickTarget = readingOrder().map(o => o.p).find(p => p.picking).id;
  const key = S.pickTarget + '/' + S.panes.length + '/' + S.layout + '/' + S.W + 'x' + S.H + '/' + S.nApps + '/' + S.lang;

function removePicker() {

function buildPicker(anim) {
  const old = S.pickEl; if (old) { old.style.transition = 'opacity .15s'; old.style.opacity = 0; setTimeout(() => old.remove(), 150); }
  const A = area(), P = PICK, target = S.panes.find(p => p.id === S.pickTarget);
  const used = new Set(S.panes.filter(p => p.app && !p.picking).map(p => p.app));
  const list = apps();
  const mapH0 = Math.min(P.mapMaxH, (P.sideW - P.pad * 2) * A.h / A.w);
  const cols = Math.max(1, Math.min(Math.floor((A.w - 24 - P.sideW - P.gridPad * 2) / P.cellW), Math.max(4, list.length)));
  const maxRows = Math.max(1, Math.floor((A.h - 16 - 12 - 16) / P.cellH));
  const rows = Math.max(1, Math.min(maxRows, Math.ceil(list.length / cols)));

  const sideMinH = P.pad + 32 + 8 + mapH0 + P.pad;
  const h = Math.min(A.h - 16, Math.max(sideMinH, 8 + gridH + dotsH + 6)), w = P.sideW + gridW;
  const gridY = Math.max(8, (h - gridH - dotsH) / 2);
  const card = el('div', 'picker glass ' + anim, overlay);
  Object.assign(card.style, { left: C.DOCK_W + A.w / 2 - w / 2 + 'px', top: A.h / 2 - h / 2 + 'px', width: w + 'px', height: h + 'px' });

  const side = el('div', 'pside', card);
  const x = el('div', 'pclose', side, svg('close')); x.style.right = P.pad + 'px'; x.style.top = P.pad + 'px';
  x.onclick = () => cancelPick(target);
  const map = el('div', 'map', side); map.style.left = P.pad + 'px'; map.style.top = P.pad + 40 + 'px';
  const k = mapH0 / A.h; map.style.width = A.w * k + 'px'; map.style.height = mapH0 + 'px';
  frames().forEach((r, i) => {
    const p = S.panes[i], b = el('div', 'mbox', map);
    Object.assign(b.style, { left: r.x * k + 1.5 + 'px', top: r.y * k + 1.5 + 'px', width: r.w * k - 3 + 'px', height: r.h * k - 3 + 'px' });
    const side_ = Math.min(r.w, r.h) * k - 3;
    if (p.id === target.id) { b.classList.add('target'); b.innerHTML = '+'; b.style.fontSize = Math.min(22, side_ * .8) + 'px'; }
    else if (p.picking) { b.classList.add('wait'); b.innerHTML = '+'; b.style.fontSize = Math.min(22, side_ * .8) + 'px'; b.onclick = () => { S.pickTarget = p.id; refreshPicker(); render(); }; }
    else { b.classList.add('full'); b.innerHTML = iconHTML(appById(p.app), Math.min(22, Math.floor(side_ * .7))); }
  });

  const grid = el('div', 'pgrid', card);
  Object.assign(grid.style, { left: 0, top: gridY + 'px', width: gridW + 'px', height: gridH + 'px' });
  const inner = el('div', '', grid); inner.style.position = 'relative'; inner.style.width = pages * gridW + 'px'; inner.style.height = '100%';
  for (let pg = 0; pg < pages; pg++) { const s = el('div', 'ppage', inner); s.style.left = pg * gridW + 'px'; s.style.width = gridW + 'px'; }
  list.forEach((a, i) => {
    const pg = Math.floor(i / perPage), row = Math.floor((i % perPage) / cols), col = i % cols;
    const isUsed = used.has(a.id);
    const c = el('div', 'pcell' + (isUsed ? ' used' : ''), inner, `<div class="ic">${iconHTML(a, P.icon)}</div><div class="lb">${appName(a)}</div>` + (isUsed ? '<div class="tick">✓</div>' : ''));
    c.style.left = pg * gridW + P.gridPad + col * P.cellW + 'px'; c.style.top = 2 + row * P.cellH + 'px';
    if (i < perPage) { c.classList.add('stag'); c.style.animationDelay = ((anim === 'in' ? .08 : .03) + row * .05 + col * .012) + 's'; }

    Object.assign(dots.style, { left: 0, top: gridY + gridH + 'px', width: gridW + 'px', height: dotsH + 'px' });
    for (let pg = 0; pg < pages; pg++) el('i', pg === 0 ? 'on' : '', dots);

}
function pickApp(pane, id) {
  pane.app = id; pane.picking = false;

  clearTimeout(pane.loadTimer);

function renderOverlays() { /* overlay giu nguyen giua cac lan ve; popup chon app tu quan ly qua refreshPicker */ }

</script>

<body>
<h1>Cài đặt tính năng · bản sắp xếp lại</h1>
<p class="sub">Cùng khuôn với trang Bong bóng tốc độ: <b>xem trước sống</b> ở đầu trang → <b>công tắc</b> tính năng → lựa chọn bằng <b>nút / ô hình</b> ngay trên trang
  → chỉ hiện mục của <b>kiểu đang chọn</b> → hướng dẫn và URL Siri <b>gập lại</b> ở cuối. Bấm thử mọi thứ trong hai iPhone.</p>

<div class="wrap">
  <div class="col"><h2>Chia màn hình</h2>
    <div class="phone"><div class="scr"><div class="liquid"><i></i><i></i><i></i><i></i></div><div class="stbar"><span>9:41</span><span>●●● 5G ▮</span></div><div class="page" id="split"></div></div></div>
    <div class="was">Trước: 4 nhóm + trang Yêu thích 1 / 2 / 3 + trang Hướng dẫn riêng.</div></div>
  <div class="col"><h2>Màn hình khởi động</h2>
    <div class="phone"><div class="scr"><div class="liquid"><i></i><i></i><i></i><i></i></div><div class="stbar"><span>9:41</span><span>●●● 5G ▮</span></div><div class="page" id="startup"></div></div></div>
    <div class="was">Trước: 12 nhóm dài; mục của nhiều kiểu chen nhau.</div></div>
</div>
<div class="note"><b>Giữ nguyên:</b> mọi cài đặt hiện có (không bỏ tính năng nào), key lưu trữ, Siri URL. <b>Đổi:</b> cách bày: bảng trên xe thành nút chọn, bỏ Vị trí tay lái, ô ghim và
  app trong yêu thích là ô có icon (chạm để chọn), yêu thích có sơ đồ bố cục thu nhỏ, hướng dẫn + URL Siri gập lại (có nút chép); Màn hình khởi động gom thành
  Kiểu → Tuỳ chỉnh kiểu này → Chung → Âm thanh → Ngày đặc biệt, chỉ hiện mục của kiểu đang chọn.</div>

<script>
const $ = id => document.getElementById(id);
const APPS = { maps: ['➤', 'linear-gradient(160deg,#6fd36b,#2e9cf5)', 'Bản đồ'], vietmap: ['V', '#f07a12', 'Vietmap'], music: ['♫', 'linear-gradient(160deg,#ff6b81,#fa2d55)', 'Nhạc'],
  spotify: ['S', '#1db954', 'Spotify'], youtube: ['▶', '#ff2a20', 'YouTube'], podcast: ['◉', 'linear-gradient(160deg,#d38bff,#8a3df0)', 'Podcast'], phone: ['✆', '#2fbf55', 'Điện thoại'] };
const ORDER = Object.keys(APPS);
const app = id => id ? `<span class="app" style="background:${APPS[id][1]}">${APPS[id][0]}</span>` : `<span class="app" style="background:rgba(120,120,140,.25)">+</span>`;
const tile = (g, c) => `<span class="ptile" style="background:${c}">${g}</span>`;
const sw = (st, k) => `<span class="swi ${st[k] ? 'on' : ''}" data-tog="${k}"></span>`;
const seg = (st, k, opts) => `<span class="seg">${opts.map(([v, t]) => `<span class="${st[k] === v ? 'on' : ''}" data-set="${k}" data-v="${v}">${t}</span>`).join('')}</span>`;
function bind(root, st, render) {
  root.querySelectorAll('[data-tog]').forEach(e => e.onclick = ev => { ev.stopPropagation(); st[e.dataset.tog] = !st[e.dataset.tog]; render(); });
  root.querySelectorAll('[data-set]').forEach(e => e.onclick = () => { const v = e.dataset.v; st[e.dataset.set] = isNaN(+v) ? v : +v; render(); });
  root.querySelectorAll('[data-fold]').forEach(e => e.onclick = () => { const k = e.dataset.fold; st.open[k] = !st.open[k]; render(); });
  root.querySelectorAll('[data-range]').forEach(e => e.oninput = () => { st[e.dataset.range] = +e.value; const v = root.querySelector('#v-' + e.dataset.range); if (v) v.textContent = e.value + (e.dataset.unit || ''); });
}
function keepScroll(pg, html) { const t = pg.scrollTop; pg.innerHTML = html; pg.scrollTop = t; }
function flash(pg, text) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; pg.parentNode.appendChild(d); setTimeout(() => d.remove(), 1600); }
const nextApp = id => ORDER[(ORDER.indexOf(id) + 1) % ORDER.length];

// =====================================================================  Chia man hinh
const SP = { on: true, auto: true, pinned: 'maps', recent: true, favs: true, open: {},
  fav: [{ name: 'Đi làm', layout: 2, apps: ['maps', 'spotify'] }, { name: 'Đi chơi', layout: 13, apps: ['vietmap', 'youtube', 'music'] }, { name: 'Đi xa', layout: 3, apps: ['maps', 'podcast', 'phone'] }] };
const LAYOUTS = [[2, '2 ô'], [3, '3 ô'], [13, '1 lớn + 2'], [31, '2 + 1 lớn']];
function layHtml(f, big) {
  const box = (id, flex) => `<div style="flex:${flex};background:${id ? APPS[id][1] : 'rgba(120,120,140,.3)'}">${id ? APPS[id][0] : ''}</div>`;
  const a = f.apps;
  if (f.layout === 2) return `<div class="lay">${box(a[0], 1)}${box(a[1], 1)}</div>`;
  if (f.layout === 3) return `<div class="lay">${box(a[0], 1)}${box(a[1], 1)}${box(a[2], 1)}</div>`;
  if (f.layout === 13) return `<div class="lay">${box(a[0], 1.4)}<div class="stk" style="flex:1">${box(a[1], 1)}${box(a[2], 1)}</div></div>`;
  return `<div class="lay"><div class="stk" style="flex:1">${box(a[0], 1)}${box(a[1], 1)}</div>${box(a[2], 1.4)}</div>`;
}
function renderSplit() {
  const pg = $('split'), off = SP.on ? '' : 'off';
  // xem truoc: bo cuc 2 o, o ghim ben phai
  const pin = `<div class="pane" style="flex:1.2;background:${APPS[SP.pinned][1]}">${APPS[SP.pinned][0]}<span class="pin">📌</span></div>`;
  const other = `<div class="pane" style="flex:1;background:${APPS.spotify[1]}">S</div>`;
  const live = SP.on ? `<div class="dk"><i style="background:#8b7cff"></i><i style="background:${APPS.maps[1]}"></i><i style="background:${APPS.music[1]}"></i></div>
      <div class="panes">${other + pin}</div>` : '<div class="off">Chia màn hình đang tắt</div>';
  const favRows = SP.fav.map((f, i) => `<div class="r tap" data-fav="${i}">${layHtml(f)}<span class="lab">${f.name}<small>${LAYOUTS.find(l => l[0] === f.layout)[1]} · ${f.apps.slice(0, f.layout === 2 ? 2 : 3).map(a => APPS[a][2]).join(', ')}</small></span><span class="chev">›</span></div>`).join('');
  const editing = SP.edit !== undefined ? SP.fav[SP.edit] : null;
  const editor = editing ? `<div class="pc glass" style="box-shadow:inset 0 0 0 2px #8b7cff, var(--glass-shadow)">
      <div class="r"><span class="lab" style="flex:none">Tên</span><input type="text" value="${editing.name}" id="favname"></div>
      <div class="r col2">${`<span class="seg">${LAYOUTS.map(([v, t]) => `<span class="${editing.layout === v ? 'on' : ''}" data-flay="${v}">${t}</span>`).join('')}</span>`}</div>
      <div class="r"><span class="lab">App<small>Chạm ô để đổi app</small></span>${editing.apps.slice(0, editing.layout === 2 ? 2 : 3).map((a, k) => `<span data-fapp="${k}" style="cursor:pointer">${app(a)}</span>`).join('')}</div>
      <div class="r"><span class="link" data-done>Xong</span></div></div>` : '';
  keepScroll(pg, `<div class="nav"><span class="back">‹ OmniCar</span><span class="t">Chia màn hình</span></div>
    <div class="live">${live}${SP.on ? '<button class="try">Mở trên xe</button>' : ''}</div>
    <div class="pc glass"><div class="r">${tile('▥', 'linear-gradient(135deg,#B7A6FF,#8B7CFF)')}<span class="lab">Chia màn hình<small>Nút OmniCar trên dock của CarPlay</small></span>${sw(SP, 'on')}</div>
      <div class="r ${off}">${tile('⚡', 'linear-gradient(135deg,#9DF2D8,#2BC79A)')}<span class="lab">Tự mở khi cắm xe<small>Mở bố cục dùng lần trước</small></span>${sw(SP, 'auto')}</div></div>
    <div class="lbl">Bố cục</div>
    <div class="pc glass ${off}">
      <div class="r tap" data-pinapp>${tile('📌', 'linear-gradient(135deg,#FFD58A,#FFB340)')}<span class="lab">Ô ghim<small>Giữ nguyên ô khi đổi bố cục</small></span>${app(SP.pinned)}<span class="v" style="min-width:0">${APPS[SP.pinned][2]}</span><span class="chev">›</span></div></div>
    <div class="foot">Thường ghim bản đồ: app đó không bị thay khi đổi bố cục hay chọn app khác.</div>
    <div class="lbl">Yêu thích</div>
    <div class="pc glass ${off}">${favRows}</div>
    ${editor}
    <div class="foot">Mở bằng Siri: omnicar://splitscreen/fav?n=1</div>
    <div class="lbl">Bảng OmniCar trên xe</div>
    <div class="pc glass ${off}"><div class="r">${tile('☰', 'linear-gradient(135deg,#FFC2D6,#FF7FA8)')}<span class="lab">Hiện trong bảng</span>
      <span class="chips" style="padding:0"><span class="chip ${SP.recent ? 'on' : ''}" data-tog="recent">Gần đây</span><span class="chip ${SP.favs ? 'on' : ''}" data-tog="favs">Yêu thích</span></span></div></div>
    <div class="pc glass">
      <div class="fold ${SP.open.g ? 'open' : ''}"><div class="h" data-fold="g">${tile('?', 'linear-gradient(135deg,#B7A6FF,#5AB8FF)')}<span class="lab">Cử chỉ trên xe</span><span class="chev">›</span></div>
        <div class="body gest"><i>▥</i>Nút OmniCar: bố cục, Gần đây, Yêu thích, thoát<i>●</i>Chấm tròn: chạm chọn tỉ lệ · kéo đổi tỉ lệ · kéo sát mép đóng ô
          <i>•••</i>Thanh •••: Đổi app / Cửa sổ nổi / Toàn màn / Đóng · kéo sang ô khác để đổi chỗ<i>⤢</i>Chạm 2 lần thanh •••: phóng to tạm<i>⇄</i>Chạm 2 lần vạch chia: đổi chỗ 2 ô<i>⌂</i>Nút Home: thoát chia màn</div></div>
      <div class="fold ${SP.open.u ? 'open' : ''}"><div class="h" data-fold="u">${tile('⌘', 'linear-gradient(135deg,#8a8fb0,#4a4f80)')}<span class="lab">Siri / Phím tắt</span><span class="chev">›</span></div>
        <div class="body">${['omnicar://splitscreen/open?left=com.apple.Maps&right=com.spotify.client', 'omnicar://splitscreen/fav?n=1', 'omnicar://splitscreen/close', 'omnicar://splitscreen/layout?id=3', 'omnicar://splitscreen/swap']
          .map(u => `<div class="url"><code>${u}</code><button class="pill" data-copy>Chép</button></div>`).join('')}</div></div></div>
    <div class="foot">Trước đây là CarDuo. Host app dựa trên carplay-cast (Ethan Arbuckle).</div>`);
  bind(pg, SP, renderSplit);
  pg.querySelectorAll('[data-pinapp]').forEach(e => e.onclick = () => { SP.pinned = nextApp(SP.pinned); renderSplit(); });
  pg.querySelectorAll('[data-fav]').forEach(e => e.onclick = () => { SP.edit = SP.edit === +e.dataset.fav ? undefined : +e.dataset.fav; renderSplit(); });
  pg.querySelectorAll('[data-flay]').forEach(e => e.onclick = () => { SP.fav[SP.edit].layout = +e.dataset.flay; renderSplit(); });
  pg.querySelectorAll('[data-fapp]').forEach(e => e.onclick = () => { const f = SP.fav[SP.edit], k = +e.dataset.fapp; f.apps[k] = nextApp(f.apps[k]); renderSplit(); });
  pg.querySelectorAll('[data-done]').forEach(e => e.onclick = () => { SP.edit = undefined; renderSplit(); });
  if ($('favname')) $('favname').oninput = e => { SP.fav[SP.edit].name = e.target.value; };
  pg.querySelectorAll('[data-copy]').forEach(e => e.onclick = () => flash(pg, 'Đã chép URL'));
  pg.querySelectorAll('.try').forEach(e => e.onclick = ev => { ev.stopPropagation(); flash(pg, 'Đã mở bố cục trên xe'); });
}

// =====================================================================  Man hinh khoi dong
const SS = { on: true, style: 9, video: 'xe-chao.mp4', fit: 0, full: false, vsound: false, logo: true, effect: 0, name: 'An', car: '', tempo: 1,
  random: [1, 2, 5, 9], dur: 5, skip: true, sound: 'chime.m4a', vol: 80, nocall: true, occ: true, bday: '06-12', open: {} };
const STY = [['Video', '▶', 'linear-gradient(160deg,#4a4f80,#1f2233)'], ['Logo', '◆', 'linear-gradient(160deg,#2a2e45,#0c0d14)'], ['Lời chào', '☀︎', 'linear-gradient(160deg,#FFD58A,#FF8A65)'],
  ['Thời tiết', '☁︎', 'linear-gradient(160deg,#8FD3FF,#5AB8FF)'], ['Khởi động máy', '◔', 'linear-gradient(160deg,#ff8a65,#c0392b)'], ['Ánh sáng chào', '❖', 'linear-gradient(160deg,#5eddb6,#1f6f8b)'],
  ['Hạt sáng', '✦', 'linear-gradient(160deg,#B7A6FF,#5b3c88)'], ['HUD tự kiểm tra', '◎', 'linear-gradient(160deg,#0f2027,#2c5364)'], ['Bảng tin', '▤', 'linear-gradient(160deg,#C9BAFC,#A6DDFD)'],
  ['Chất lỏng', '◍', 'radial-gradient(circle at 20% 20%,#C9BAFC,transparent 60%),radial-gradient(circle at 80% 80%,#A0F1D9,transparent 60%),#FEC4D8'], ['Ngẫu nhiên', '⤨', 'conic-gradient(from 210deg,#A78BFA,#60C5FA,#5EDDB6,#F59AC0,#A78BFA)']];
// Muc rieng cua tung kieu (chi hien muc cua kieu dang chon)
function styleOptions() {
  const nameRow = `<div class="r">${tile('A', 'linear-gradient(135deg,#FFC2D6,#FF7FA8)')}<span class="lab" style="flex:none">Tên của bạn</span><input type="text" value="${SS.name}" placeholder="Không bắt buộc"></div>`;
  const carRow = `<div class="r">${tile('🚗', 'linear-gradient(135deg,#8FD3FF,#5AB8FF)')}<span class="lab" style="flex:none">Tên xe</span><input type="text" value="${SS.car}" placeholder="Theo CarPlay"></div>`;
  switch (SS.style) {
    case 0: return `<div class="r">${tile('▶', 'linear-gradient(135deg,#8a8fb0,#4a4f80)')}<span class="lab">${SS.video || 'Chưa có video'}<small>MP4, MOV · tối đa 60 giây</small></span><span class="btns"><button class="pill main" data-add>Đổi</button>${SS.video ? '<button class="pill danger" data-delv>Xoá</button>' : ''}</span></div>
      <div class="r col2">${seg(SS, 'fit', [[0, 'Lấp đầy'], [1, 'Vừa khung']])}</div>
      <div class="r"><span class="lab">Phát hết video</span>${sw(SS, 'full')}</div>
      <div class="r"><span class="lab">Âm thanh của video<small>Thay cho âm thanh khởi động</small></span>${sw(SS, 'vsound')}</div>`;
    case 1: return `<div class="r">${tile('◆', 'linear-gradient(135deg,#2a2e45,#0c0d14)')}<span class="lab">${SS.logo ? 'logo.png' : 'Chưa có logo'}<small>PNG nền trong suốt là đẹp nhất</small></span><span class="btns"><button class="pill main" data-logo>Chọn</button>${SS.logo ? '<button class="pill danger" data-dellogo>Xoá</button>' : ''}</span></div>
      <div class="r col2">${seg(SS, 'effect', [[0, 'Hiện dần'], [1, 'Phóng to'], [2, 'Phát sáng']])}</div>`;
    case 2: case 6: return nameRow;
    case 3: return nameRow + `<div class="r"><span class="lab"><small>Lấy thời tiết theo vị trí gần nhất mỗi lần cắm xe · cập nhật 08:12</small></span></div>`;
    case 4: case 7: return carRow;
    case 5: return carRow + `<div class="r col2">${seg(SS, 'tempo', [[0, 'Chậm rãi'], [1, 'Vừa'], [2, 'Nhanh']])}</div>`;
    case 8: return nameRow + `<div class="r"><span class="lab"><small>Thẻ lịch hẹn chỉ hiện khi đã cho phép truy cập Lịch.</small></span></div>`;
    case 9: return `<div class="r"><span class="lab"><small>Bộ mặt OmniCar: nền pastel chảy chậm, logo kính nổi lên. Không cần chỉnh gì.</small></span></div>`;
    case 10: return `<div class="r"><span class="lab">Chọn ngẫu nhiên từ</span></div><div class="chips">${STY.slice(0, 10).map(([n], i) => `<span class="chip ${SS.random.includes(i) ? 'on' : ''}" data-rand="${i}">${n}</span>`).join('')}</div>`;
  }
}
function renderStartup() {
  const pg = $('startup'), off = SS.on ? '' : 'off', [sn, sg, sc] = STY[SS.style];
  keepScroll(pg, `<div class="nav"><span class="back">‹ OmniCar</span><span class="t">Màn hình khởi động</span></div>
    <div class="live" style="background:${sc}">${SS.on ? `<div class="su"><div><b>${sg} ${SS.style === 2 || SS.style === 8 ? 'Chào buổi sáng, ' + (SS.name || 'bạn') : sn}</b><span>Chạm để xem lại</span></div></div><button class="try">Xem thử trên xe</button>` : '<div class="off">Đang tắt</div>'}</div>
    <div class="pc glass"><div class="r">${tile('✦', 'linear-gradient(135deg,#B7A6FF,#8B7CFF)')}<span class="lab">Màn hình khởi động<small>Hiện khi cắm CarPlay</small></span>${sw(SS, 'on')}</div></div>
    <div class="lbl">Kiểu</div>
    <div class="pc glass ${off}"><div class="styles">${STY.map(([n, g, c], i) => `<div class="sopt ${SS.style === i ? 'on' : ''}" data-sty="${i}"><div class="box" style="background:${c}">${g}</div>${n}</div>`).join('')}</div></div>
    <div class="lbl">${sn}</div>
    <div class="pc glass ${off}">${styleOptions()}</div>
    <div class="lbl">Chung</div>
    <div class="pc glass ${off}">
      <div class="r">${tile('⏱', 'linear-gradient(135deg,#9DF2D8,#2BC79A)')}<span class="lab" style="flex:none">Thời lượng</span><input type="range" min="1" max="30" value="${SS.dur}" data-range="dur" data-unit=" giây"><span class="v" id="v-dur" style="min-width:52px">${SS.dur} giây</span></div>
      <div class="r">${tile('☝', 'linear-gradient(135deg,#8FD3FF,#5AB8FF)')}<span class="lab">Chạm để bỏ qua</span>${sw(SS, 'skip')}</div></div>
    <div class="lbl">Âm thanh khởi động</div>
    <div class="pc glass ${off}">
      <div class="r">${tile('♪', 'linear-gradient(135deg,#FFC2D6,#FF7FA8)')}<span class="lab">${SS.sound || 'Chưa có âm thanh'}<small>Phát qua loa xe khi cắm CarPlay</small></span><span class="btns">${SS.sound ? '<button class="pill" data-play>▶</button>' : ''}<button class="pill main" data-snd>${SS.sound ? 'Đổi' : 'Chọn'}</button>${SS.sound ? '<button class="pill danger" data-delsnd>Xoá</button>' : ''}</span></div>
      <div class="r">${tile('🔊', 'linear-gradient(135deg,#B7A6FF,#5AB8FF)')}<span class="lab" style="flex:none">Âm lượng</span><input type="range" min="0" max="100" value="${SS.vol}" data-range="vol" data-unit="%"><span class="v" id="v-vol">${SS.vol}%</span></div>
      <div class="r">${tile('✆', 'linear-gradient(135deg,#9DF2D8,#2BC79A)')}<span class="lab">Im lặng khi đang gọi</span>${sw(SS, 'nocall')}</div></div>
    <div class="lbl">Ngày đặc biệt</div>
    <div class="pc glass ${off}">
      <div class="r">${tile('🎉', 'linear-gradient(135deg,#FFD58A,#FFB340)')}<span class="lab">Màn hình ngày lễ<small>Tết, Trung thu, Giáng sinh, Năm mới</small></span>${sw(SS, 'occ')}</div>
      <div class="r">${tile('🎂', 'linear-gradient(135deg,#FFC2D6,#FF7FA8)')}<span class="lab">Sinh nhật</span><span class="v" style="min-width:0">${SS.bday ? SS.bday.split('-').reverse().join('/') : 'Chưa đặt'}</span><button class="pill" data-bday>${SS.bday ? 'Đổi' : 'Đặt'}</button></div>
      <div class="r"><span class="link" data-occprev>Xem thử ngày lễ tiếp theo</span></div></div>
    <div class="foot">Ngày lễ hiện tối đa 3 lần trong ngày, thay cho kiểu đã chọn.</div>`);
  bind(pg, SS, renderStartup);
  pg.querySelectorAll('[data-sty]').forEach(e => e.onclick = () => { SS.style = +e.dataset.sty; renderStartup(); });
  pg.querySelectorAll('[data-rand]').forEach(e => e.onclick = () => { const i = +e.dataset.rand; SS.random = SS.random.includes(i) ? (SS.random.length > 1 ? SS.random.filter(x => x !== i) : SS.random) : SS.random.concat(i); renderStartup(); });
  const act = (sel, f) => pg.querySelectorAll(sel).forEach(e => e.onclick = () => { f(); renderStartup(); });
  act('[data-add]', () => { SS.video = 'video-moi.mp4'; flash(pg, 'Từ Ảnh / Từ Tệp'); }); act('[data-delv]', () => SS.video = '');
  act('[data-logo]', () => SS.logo = true); act('[data-dellogo]', () => SS.logo = false);
  act('[data-snd]', () => SS.sound = 'am-thanh.m4a'); act('[data-delsnd]', () => SS.sound = '');
  pg.querySelectorAll('[data-play]').forEach(e => e.onclick = () => flash(pg, 'Đang phát…'));
  act('[data-bday]', () => SS.bday = SS.bday ? '' : '06-12');
  pg.querySelectorAll('[data-occprev], .try').forEach(e => e.onclick = ev => { ev.stopPropagation(); flash(pg, 'Đang hiện trên xe'); });
}
renderSplit(); renderStartup();
</script>
</body>
</html>
</template>

.swi { width: 46px; height: 28px; border-radius: 14px; background: rgba(120,120,140,.22); position: relative; flex: none; cursor: pointer; transition: background .2s; }
.swi::after { content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,.2); transition: transform .3s var(--hm-spring); }
.swi.on { background: #34C759; } .swi.on::after { transform: translateX(18px); }
.link { color: #5b6cf0; font-weight: 600; cursor: pointer; font-size: 14.5px; }
/* xem truoc song o dau trang */
.live { position: relative; height: 128px; border-radius: 18px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 6px 16px rgba(40,30,90,.2); }
.live .map { transform: scale(.75); transform-origin: 0 0; width: 133.4%; height: 133.4%; }
.live .lb { position: absolute; left: 50%; top: 50%; z-index: 2; width: max-content; transform-origin: center; }

/* chon kieu: dai cuon ngang, moi o la bong bong that thu nho */

.sopt .box .in { position: absolute; left: 50%; top: 50%; width: max-content; transform-origin: center; }

.sopt.on .box::after { content: ""; position: absolute; inset: 0; border-radius: 14px; padding: 2.5px; background: var(--aurora);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
/* nguon toc do: o chon co icon app */
.srcs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 12px 4px; }

  background: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9); }

  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.hint { font-size: 12px; color: var(--ink2); padding: 6px 14px 12px; display: flex; gap: 6px; align-items: flex-start; }

@keyframes warn { from { opacity: .25; } }
</style>

<body>

    Không có giới hạn: biển hiện “--” màu xám, không đổi màu theo trạng thái. Cảnh báo: Tắt / Cảnh báo / Âm thanh, ngưỡng −10…+10 so với giới hạn.</div>
