<script>
const $ = id => document.getElementById(id);
const STYLES = [
  { id: 'drop',  n: 'Giọt kính',  d: 'Đĩa kính tròn như giọt nước, viền cầu vồng 4 màu logo; biển nhỏ chồm góc trên. Mặc định.', ts: .78 },
  { id: 'pill',  n: 'Viên kính',  d: 'Viên thuốc ngang: chấm trạng thái, số + đơn vị, vạch mảnh, biển. Gọn khi để mép trên / dưới.', ts: .66 },
  { id: 'twin',  n: 'Cặp đôi',    d: 'Đĩa tốc độ và biển cùng cỡ đặt cạnh nhau, không đè lên nhau; vượt thì đĩa tốc độ đỏ đặc — nhìn liếc là thấy.', ts: .7 },
  { id: 'arc',   n: 'Vòng cung',  d: 'Cung 270° lấp đầy theo tốc độ / giới hạn, cầu vồng → hổ phách → đỏ; biển ở khe dưới.', ts: .74 },
  { id: 'tile',  n: 'Thẻ Harmony', d: 'Thẻ vuông bo lớn nền 4 màu logo, số to, thanh tiến độ; gần / vượt thì cả thẻ đổi màu.', ts: .68 },
  { id: 'min',   n: 'Tối giản',   d: 'Không nền: số lớn có quầng sáng để đọc trên mọi bản đồ, gạch mảnh theo tốc độ, biển bên cạnh.', ts: .66 },
  { id: 'night', n: 'Kính đêm',   d: 'Viên thuốc dọc kính khói, viền neon cầu vồng; hợp bản đồ tối, chiếm ít chỗ ngang.', ts: .62 },
  { id: 'hud',   n: 'Dải HUD',    d: 'Thanh ngang mảnh: vạch sáng chạy dần tới biển giới hạn; đầy thanh = chạm giới hạn → đỏ, biển nhấp nháy.', ts: .5 },
  { id: 'dash',  n: 'Đồng hồ taplo', d: 'Mặt đồng hồ kim như taplo xe: vạch 0–160 km/h, vùng đỏ từ mức giới hạn, cung sáng theo tốc độ, số điện tử dưới kim.', ts: .7 },
];
const SOURCES = { vietmap: ['V', '#f07a12', 'Vietmap Live'], gofa: ['G', '#1aa260', 'GOFA'], waze: ['W', '#33ccff', 'Waze'] };
const SRC_HINT = {
  vietmap: '<b>Tốc độ + biển giới hạn.</b> Mở Vietmap Live một lần rồi để chạy nền.', gofa: '<b>Tốc độ + biển giới hạn.</b> Mở GOFA một lần rồi để chạy nền.',
  waze: '<b>Tốc độ từ GPS,</b> biển chỉ có khi Waze đang hiện biển (thử nghiệm).' };
const S = { style: 'drop', speed: 47, limit: 50, unit: 'kmh', sign: 'vi', icon: true, src: 'vietmap', size: 100, map: 'light',
  on: true, unitPref: 'auto', signPref: 'auto', warn: 2, over: 5, sizePhone: 100 };   // unitPref / signPref 'auto' = theo vung (VN: km/h, bien tron)

const state = (v, lim) => !lim ? 'normal' : v > lim ? 'over' : v >= lim * .9 ? 'near' : 'normal';
// Dai HUD: canh bao ngay khi cham gioi han
const hudState = (v, lim) => !lim ? 'normal' : v >= lim ? 'over' : v >= lim * .9 ? 'near' : 'normal';
const hudFill = (v, lim) => Math.min(100, v / (lim || 160) * 100);
const conv = v => S.unit === 'mph' ? Math.round(v * 0.621371) : v;
const unitTxt = () => S.unit === 'mph' ? 'mph' : 'km/h';
function signHtml(lim) {
  const t = lim ? conv(lim) : '--', none = lim ? '' : 'none';
  return S.sign === 'us' ? `<span class="sign us ${none}"><i>SPEED<br>LIMIT</i>${t}</span>` : `<span class="sign vi ${none}">${t}</span>`;
}
const icoHtml = () => S.icon ? `<span class="ico" style="background:${SOURCES[S.src][1]}">${SOURCES[S.src][0]}</span>` : '';

// Ve 1 bong bong: style, toc do (km/h), gioi han (km/h, 0 = khong co)
function bubble(style, v, lim) {
  const st = state(v, lim), num = conv(v), u = unitTxt(), ratio = lim ? Math.min(1.25, v / lim) : Math.min(1, v / 160);
  const S_ = `<span class="num">${num}</span>`, U = `<span class="unit">${u}</span>`;
  switch (style) {
    case 'drop': return `<div class="bub s-drop lglass ${st} ${st === 'over' ? 'pulse' : ''}"><span class="shine"></span><div class="in">${S_}${U}</div>${signHtml(lim)}${icoHtml()}</div>`;
    case 'pill': return `<div class="bub s-pill lglass ${st} ${st === 'over' ? 'pulse' : ''}">${S.icon ? icoHtml() : `<span class="dot"></span>`}<div class="sp">${S_}${U}</div><span class="bar"></span>${signHtml(lim)}</div>`;
    case 'twin': return `<div class="bub s-twin ${st}"><div class="sp lglass ${st === 'over' ? 'pulse' : ''}">${S_}${U}${icoHtml()}</div>${signHtml(lim)}</div>`;
    case 'arc': {
      const r = 46, c = 2 * Math.PI * r, arc = c * .75, fill = arc * Math.min(1, ratio);
      const col = st === 'over' ? 'var(--over)' : st === 'near' ? 'var(--near)' : 'url(#ag)';
      return `<div class="bub s-arc lglass ${st} ${st === 'over' ? 'pulse' : ''}"><svg viewBox="0 0 104 104"><defs><linearGradient id="ag" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#60C5FA"/><stop offset="1" stop-color="#5EDDB6"/></linearGradient></defs>
        <circle cx="52" cy="52" r="${r}" fill="none" stroke="rgba(74,79,128,.12)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${arc} ${c}"/>
        <circle cx="52" cy="52" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${fill} ${c}"/></svg>
        <div class="in">${S_}${U}</div>${signHtml(lim)}${icoHtml()}</div>`;
    }
    case 'tile': return `<div class="bub s-tile ${st} ${st === 'over' ? 'pulse' : ''}"><div class="hd">${S.icon ? icoHtml() : '<span></span>'}${signHtml(lim)}</div>
      <div><div style="display:flex;align-items:baseline;gap:4px">${S_}${U}</div></div><div class="prog"><i style="width:${Math.min(100, ratio * 100)}%"></i></div></div>`;
    case 'min': return `<div class="bub s-min ${st}"><div class="sp">${S.icon ? `<div class="row" style="gap:6px">${icoHtml()}</div>` : ''}<div class="row">${S_}${U}</div><div class="line"><i style="width:${Math.min(100, ratio * 100)}%"></i></div></div>${signHtml(lim)}</div>`;
    case 'night': return `<div class="bub s-night dark dglass ${st} ${st === 'over' ? 'pulse' : ''}">${signHtml(lim)}<div class="sp">${S_}${U}</div>${icoHtml()}</div>`;
    case 'hud': {
      // thanh = 0 -> gioi han (khong co gioi han: 0 -> 160); cham gioi han (>=) la canh bao
      const hst = hudState(v, lim);
      return `<div class="bub s-hud lglass ${hst} ${hst === 'over' ? 'pulse' : ''}">${icoHtml()}<div class="sp">${S_}${U}</div><div class="ticks"><div class="fill" style="width:${hudFill(v, lim)}%"></div></div>${signHtml(lim)}</div>`;
    }
    case 'dash': {
      // goc 150 do (duoi trai) -> 390 do (duoi phai), quet 240 do theo chieu kim dong ho; truc y man hinh huong xuong
      const mph = S.unit === 'mph', MAX = mph ? 100 : 160, MINOR = 10, MAJOR = 20;
      const ang = x => 150 + 240 * Math.min(1.04, x / MAX);
      const pt = (r, a) => `${(70 + r * Math.cos(a * Math.PI / 180)).toFixed(2)} ${(70 + r * Math.sin(a * Math.PI / 180)).toFixed(2)}`;
      const arcD = (r, a1, a2) => `M${pt(r, a1)} A${r} ${r} 0 ${a2 - a1 > 180 ? 1 : 0} 1 ${pt(r, a2)}`;
      let marks = '';
      for (let x = 0; x <= MAX; x += MINOR) {
        const a = ang(x), big = x % MAJOR === 0;
        marks += `<path d="M${pt(big ? 53 : 57, a)} L${pt(61, a)}" stroke="rgba(255,255,255,${big ? .9 : .45})" stroke-width="${big ? 2 : 1.2}" stroke-linecap="round"/>`;
        if (big) { const [tx, ty] = pt(43, a).split(' '); marks += `<text x="${tx}" y="${ty}" dy="3.2" text-anchor="middle" font-size="9" font-weight="700" fill="rgba(255,255,255,.85)">${x}</text>`; }
      }
      const cv = conv(v), cl = lim ? conv(lim) : 0;
      const col = st === 'over' ? '#FF5A5F' : st === 'near' ? '#FFB340' : 'url(#dg)';
      const red = cl && cl < MAX ? `<path d="${arcD(63, ang(cl), ang(MAX))}" fill="none" stroke="#FF5A5F" stroke-width="3.5" opacity=".9"/>
        <path d="M${pt(52, ang(cl))} L${pt(65, ang(cl))}" stroke="#FF5A5F" stroke-width="2.5" stroke-linecap="round"/>` : '';
      const prog = cv > 0 ? `<path d="${arcD(49, 150, ang(cv))}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" opacity=".95"/>` : '';
      return `<div class="bub s-dash ${st} ${st === 'over' ? 'pulse' : ''}"><svg viewBox="0 0 140 140"><defs>
          <radialGradient id="dface" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#2a2e45"/><stop offset="1" stop-color="#0c0d14"/></radialGradient>
          <linearGradient id="dring" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset=".35" stop-color="#60C5FA"/><stop offset=".7" stop-color="#5EDDB6"/><stop offset="1" stop-color="#F59AC0"/></linearGradient>
          <linearGradient id="dg" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#A78BFA"/><stop offset=".5" stop-color="#60C5FA"/><stop offset="1" stop-color="#5EDDB6"/></linearGradient></defs>
        <circle cx="70" cy="70" r="67" fill="url(#dface)" stroke="url(#dring)" stroke-width="3"/>
        <circle cx="70" cy="70" r="64" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
        ${red}${marks}${prog}
        <g transform="rotate(${ang(cv).toFixed(1)} 70 70)"><polygon points="58,67.8 117,70 58,72.2" fill="#FF5A36" style="filter:drop-shadow(0 0 3px rgba(255,90,54,.8))"/></g>
        <circle cx="70" cy="70" r="7" fill="#23263a" stroke="rgba(255,255,255,.85)" stroke-width="1.5"/></svg>
        <div class="rd">${S_}${U}</div>${signHtml(lim)}${icoHtml()}</div>`;
    }
  }
}

function renderCar() {
  $('map').className = 'map ' + S.map;
  $('cs').classList.toggle('mapdark', S.map === 'dark');
  // Dai HUD: chi cap nhat so / trang thai / do dai thanh (giu nguyen phan tu de thanh chay muot)
  const key = [S.style, S.unit, S.sign, S.icon, S.src, S.limit].join('|'), hud = $('slot').querySelector('.s-hud');
  if (S.style === 'hud' && hud && $('slot').dataset.key === key) {
    const st = hudState(S.speed, S.limit);
    hud.className = `bub s-hud lglass ${st} ${st === 'over' ? 'pulse' : ''}`;
    hud.querySelector('.num').textContent = conv(S.speed);
    hud.querySelector('.fill').style.width = hudFill(S.speed, S.limit) + '%';
  } else { $('slot').innerHTML = bubble(S.style, S.speed, S.limit); $('slot').dataset.key = key; }
  $('slot').style.transform = `scale(${S.size / 100})`;
  $('slot').style.display = S.on ? '' : 'none';
  const overBy = S.unit === 'mph' ? S.over * 1.609 : S.over;
  $('fit').classList.toggle('warn', S.on && S.warn > 0 && S.limit > 0 && S.speed > S.limit + overBy);
  const st = (S.style === 'hud' ? hudState : state)(S.speed, S.limit);
  $('stateTxt') && ($('stateTxt').textContent = !S.limit ? 'Không có giới hạn (biển xám)' : st === 'over' ? (S.style === 'hud' ? 'Chạm / vượt giới hạn: cảnh báo' : 'Vượt giới hạn') : st === 'near' ? 'Sắp chạm giới hạn (≥ 90 %)' : 'Dưới giới hạn');
}
function renderGallery() {
  const lim = S.limit || 60;
  const cases = [['Dưới', Math.round(lim * .7)], ['Sắp chạm', Math.round(lim * .95)], ['Vượt', Math.round(lim * 1.2)]];
  $('gallery').innerHTML = STYLES.map(s => `<div class="card glass ${S.style === s.id ? 'sel' : ''}" data-style="${s.id}">
      <h3>${s.n}<small>${STYLES.indexOf(s) + 1} / ${STYLES.length}</small></h3><p>${s.d}</p>
      <div class="trio ${S.map === 'dark' ? 'mapdark' : ''}">${cases.map(([l, v]) => `<div class="tile"><div class="map ${S.map}"></div><div class="bub-wrap" style="--ts:${s.ts}"><div class="bub-scale" style="transform:scale(${s.ts})">${bubble(s.id, v, S.limit === 0 ? 0 : lim)}</div></div><span class="lab">${l}</span></div>`).join('')}</div></div>`).join('');
  document.querySelectorAll('[data-style]').forEach(e => e.onclick = () => { S.style = e.dataset.style; renderAll(); });
  // moi bong bong tu co vua o (tinh ca bien / icon chom ra ngoai)
  document.querySelectorAll('.tile').forEach(t => {
    const w = t.querySelector('.bub-scale'), b = w.firstElementChild;
    w.style.transform = 'translate(-50%, -50%)';
    let r = b.getBoundingClientRect(), l = r.left, tp = r.top, rt = r.right, bt = r.bottom;
    b.querySelectorAll('*').forEach(c => { const q = c.getBoundingClientRect(); if (!q.width) return; l = Math.min(l, q.left); tp = Math.min(tp, q.top); rt = Math.max(rt, q.right); bt = Math.max(bt, q.bottom); });
    const k = Math.min(.8, (t.clientWidth - 12) / (rt - l), (t.clientHeight - 30) / (bt - tp));
    w.style.transform = `translate(-50%, calc(-50% - 6px)) scale(${k})`;
  });
}
// Thanh mo phong (khong thuoc Cai dat): toc do, gioi han, ban do, chay thu
function renderSim() {
  const seg = (k, opts) => `<span class="seg">${opts.map(([v, t]) => `<span class="${S[k] === v ? 'on' : ''}" data-sim="${k}" data-v="${v}">${t}</span>`).join('')}</span>`;
  $('sim').innerHTML = `<b>Mô phỏng</b>
    <div class="ctl"><span>Tốc độ</span><input type="range" min="0" max="140" value="${S.speed}" id="spd"><span class="val" id="spdv" style="width:62px">${conv(S.speed)} ${unitTxt()}</span></div>
    <div class="ctl"><span>Giới hạn</span>${seg('limit', [[0, '—'], [40, '40'], [50, '50'], [60, '60'], [80, '80'], [100, '100']])}</div>
    <div class="ctl"><span>Bản đồ</span>${seg('map', [['light', 'Sáng'], ['dark', 'Tối']])}</div>
    <button class="btn" id="drive">${driving ? '■ Dừng' : '▶ Chạy thử'}</button><span class="state" id="stateTxt"></span>`;
  $('spd').oninput = e => { S.speed = +e.target.value; $('spdv').textContent = `${conv(S.speed)} ${unitTxt()}`; renderCar(); renderLive(); };
  document.querySelectorAll('[data-sim]').forEach(e => e.onclick = () => { const k = e.dataset.sim, v = e.dataset.v; S[k] = isNaN(+v) ? v : +v; renderAll(); });
  $('drive').onclick = toggleDrive;
}

// Trang Cai dat Bong bong toc do (ban moi)
function renderSettings() {
  const pg = $('page'), top = pg.scrollTop, sx = pg.querySelector('.styles') ? pg.querySelector('.styles').scrollLeft : 0;
  const seg = (k, opts) => `<span class="seg">${opts.map(([v, t]) => `<span class="${S[k] === v ? 'on' : ''}" data-pref="${k}" data-v="${v}">${t}</span>`).join('')}</span>`;
  const tile = (g, c) => `<span class="ptile" style="background:${c}">${g}</span>`;
  const off = S.on ? '' : 'off';
  const ou = S.unit === 'mph' ? 'mph' : 'km/h';
  // Nguong -10..10 so voi gioi han: duong = qua gioi han, am = bao tu truoc khi cham, 0 = ngay khi cham
  const thTxt = () => S.over > 0 ? `quá giới hạn ${S.over} ${ou}` : S.over < 0 ? `dưới giới hạn ${-S.over} ${ou}` : 'chạm giới hạn';
  const thVal = () => `${S.over > 0 ? '+' : ''}${S.over} ${ou}`;
  const warnFoot = () => S.warn ? `Cảnh báo khi chạy ${thTxt()}: viền đỏ nhấp nháy quanh màn CarPlay${S.warn === 2 ? ', kêu một tiếng ngắn' : ''}. Cần nguồn có biển giới hạn.`
    : 'Không cảnh báo, bong bóng vẫn đổi màu khi vượt.';
  pg.innerHTML = `<div class="nav"><span class="back">‹ OmniCar</span><span class="t">Bong bóng tốc độ</span></div>
    <div class="live"><div class="map ${S.map}"></div><div class="lb" id="live"></div><button class="try" id="try">Xem thử trên xe</button></div>
    <div class="pc glass"><div class="r">${tile('⏱', 'linear-gradient(135deg,#B7A6FF,#8B7CFF)')}<span class="lab">Bong bóng tốc độ<small>Hiện khi app dẫn đường chạy nền</small></span>
      <span class="swi ${S.on ? 'on' : ''}" data-tog="on"></span></div></div>
    <div class="lbl">Kiểu</div>
    <div class="pc glass ${off}"><div class="styles">${STYLES.map(st => `<div class="sopt ${S.style === st.id ? 'on' : ''}" data-pick="${st.id}"><div class="box"><div class="in">${bubble(st.id, 52, 60)}</div></div>${st.n}</div>`).join('')}</div>
      <div class="r">${tile('◉', 'linear-gradient(135deg,#FFC2D6,#FF7FA8)')}<span class="lab">Icon app nguồn</span><span class="swi ${S.icon ? 'on' : ''}" data-tog="icon"></span></div></div>
    <div class="lbl">Nguồn tốc độ</div>
    <div class="pc glass ${off}"><div class="srcs">${Object.entries(SOURCES).map(([k, [g, c, n]]) => `<div class="src ${S.src === k ? 'on' : ''}" data-src="${k}"><span class="ico" style="background:${c}">${g}</span>${n.replace(' iPhone', '<br>iPhone').replace(' Live', '')}</div>`).join('')}</div>
      <div class="hint">ⓘ <span>${SRC_HINT[S.src]}</span></div></div>
    <div class="lbl">Hiển thị</div>
    <div class="pc glass ${off}">
      <div class="r">${tile('km', 'linear-gradient(135deg,#8FD3FF,#5AB8FF)')}<span class="lab">Đơn vị</span>${seg('unitPref', [['auto', 'Tự động'], ['kmh', 'km/h'], ['mph', 'mph']])}</div>
      <div class="r">${tile('⊘', 'linear-gradient(135deg,#FF9A9E,#E5262D)')}<span class="lab">Biển</span>${seg('signPref', [['auto', 'Tự động'], ['vi', 'Tròn'], ['us', 'Mỹ']])}</div></div>
    <div class="foot">Tự động: theo vùng của iPhone (Việt Nam: km/h, biển tròn).</div>
    <div class="lbl">Cảnh báo quá tốc độ</div>
    <div class="pc glass ${off}">
      <div class="r col">${seg('warn', [[0, 'Tắt'], [1, 'Cảnh báo'], [2, 'Âm thanh']])}</div>
      ${S.warn ? `<div class="r">${tile('!', 'linear-gradient(135deg,#FFD58A,#FFB340)')}<span class="lab" style="flex:none">Ngưỡng</span><input type="range" min="-10" max="10" value="${S.over}" data-range="over"><span class="v" id="v-over">${thVal()}</span></div>` : ''}</div>
    <div class="foot" id="warnfoot">${warnFoot()}</div>
    <div class="lbl">Cỡ và vị trí</div>
    <div class="pc glass ${off}">
      <div class="r">${tile('▭', 'linear-gradient(135deg,#9DF2D8,#2BC79A)')}<span class="lab" style="flex:none;width:64px">CarPlay</span><input type="range" min="60" max="220" value="${S.size}" data-range="size"><span class="v" id="v-size">${S.size}%</span></div>
      <div class="r">${tile('▯', 'linear-gradient(135deg,#9DF2D8,#2BC79A)')}<span class="lab" style="flex:none;width:64px">iPhone</span><input type="range" min="60" max="220" value="${S.sizePhone}" data-range="sizePhone"><span class="v" id="v-sizePhone">${S.sizePhone}%</span></div>

  pg.querySelectorAll('[data-src]').forEach(e => e.onclick = () => { S.src = e.dataset.src; if (!S.limit) S.limit = 50; renderAll(); });

    renderAll();
  });

    const k = e.dataset.range; S[k] = +e.value;

    if (k === 'over') $('warnfoot').textContent = warnFoot();
    renderCar();
  });
  $('resetpos').onclick = () => { S.size = 100; S.sizePhone = 100; Object.assign($('slot').style, { left: '78px', top: '182px' }); renderAll(); };
  $('try').onclick = () => { if (!driving) toggleDrive(); };
  // o chon kieu: bong bong that thu vua o
  pg.querySelectorAll('.sopt .box').forEach(box => fitInto(box, box.querySelector('.in'), .9));
  renderLive();
}
// Dat bong bong vua khung (tinh ca phan chom ra ngoai)
function fitInto(box, w, max) {
  const b = w.firstElementChild;
  if (!b) return;
  w.style.transform = 'translate(-50%, -50%)';
  let r = b.getBoundingClientRect(), l = r.left, tp = r.top, rt = r.right, bt = r.bottom;
  b.querySelectorAll('*').forEach(c => { const q = c.getBoundingClientRect(); if (!q.width) return; l = Math.min(l, q.left); tp = Math.min(tp, q.top); rt = Math.max(rt, q.right); bt = Math.max(bt, q.bottom); });
  const k = Math.min(max, (box.clientWidth - 10) / (rt - l), (box.clientHeight - 10) / (bt - tp));
  w.style.transform = `translate(-50%, -50%) scale(${k})`;
}
// Xem truoc song o dau trang Cai dat: cung toc do voi man xe
function renderLive() {
  const live = $('live');
  if (!live) return;
  live.innerHTML = S.on ? bubble(S.style, S.speed, S.limit) : '<span style="color:var(--ink2);font-size:13px">Đang tắt</span>';
  fitInto(live.parentNode, live, .85);
}
function renderAll() { renderSettings(); renderSim(); renderGallery(); renderCar(); }

// Chay thu: tang toc qua gioi han roi giam
let driving = false, timer, t0;
function toggleDrive() {
  driving = !driving;
  clearInterval(timer);
  if (driving) {
    t0 = performance.now();
    if (!S.limit) S.limit = 60;
    timer = setInterval(() => {
      const t = (performance.now() - t0) / 1000, lim = S.limit;
      S.speed = Math.max(0, Math.round(lim * (0.55 + 0.65 * (0.5 - 0.5 * Math.cos(t * 0.45)))));
      $('spd').value = S.speed; $('spdv').textContent = `${conv(S.speed)} ${unitTxt()}`;
      renderCar(); renderLive();
    }, 120);
  }
  renderSim(); renderCar(); renderLive();
}

// Keo bong bong tren man xe
(() => {
  const slot = $('slot'); let sx, sy, ox, oy, k;
  slot.onpointerdown = e => { k = $('fit').clientWidth / 800; sx = e.clientX; sy = e.clientY; ox = slot.offsetLeft; oy = slot.offsetTop; slot.setPointerCapture(e.pointerId); };
  slot.onpointermove = e => { if (sx === undefined) return; slot.style.left = Math.max(64, Math.min(760, ox + (e.clientX - sx) / k)) + 'px'; slot.style.top = Math.max(0, Math.min(280, oy + (e.clientY - sy) / k)) + 'px'; };
  slot.onpointerup = () => { sx = undefined; };
})();
function fit() { $('cs').style.setProperty('--k', $('fit').clientWidth / 800); }
window.addEventListener('resize', fit);
renderAll(); fit();
</script>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = x => 1 - Math.pow(1 - clamp(x), 3);
const span = (t, a, b) => clamp((t - a) / (b - a));
const rnd = (a, b) => a + Math.random() * (b - a);
const FONT = '-apple-system, "SF Pro Rounded", "SF Pro Display", "Segoe UI", Roboto, sans-serif';
function greet() {
  const h = new Date().getHours();
  return h >= 5 && h < 11 ? 'Chào buổi sáng' : h >= 11 && h < 17 ? 'Chào buổi chiều' : 'Chào buổi tối';   // khuya cung 'Chào buổi tối'
}
function text(s, x, y, size, alpha = 1, weight = 700, color = '255,255,255', align = 'center') {
  ctx.save();
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = `rgba(${color},${alpha})`;
  ctx.shadowColor = `rgba(0,0,0,${0.45 * alpha})`; ctx.shadowBlur = 18;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function bg(top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function radial(cx, cy, r, inner, outer) {
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const time = () => new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

// ---------------------------------------------------------------- 1. Khởi động máy
function gauge(cx, cy, r, value, label, unit, max, redFrom) {
  const a0 = Math.PI * 0.75, a1 = Math.PI * 2.25;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1); ctx.stroke();
  const av = a0 + (a1 - a0) * value;
  const g = ctx.createLinearGradient(cx - r, cy, cx + r, cy);
  g.addColorStop(0, '#7fd3ff'); g.addColorStop(1, value > redFrom ? '#ff5c54' : '#ffffff');
  ctx.strokeStyle = g; ctx.lineWidth = 10; ctx.shadowColor = 'rgba(255,255,255,.6)'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, av); ctx.stroke();
  ctx.shadowBlur = 0;
  for (let i = 0; i <= 10; i++) {
    const a = a0 + (a1 - a0) * i / 10, inR = r - 26, outR = r - 14;
    ctx.strokeStyle = i / 10 >= redFrom ? 'rgba(255,92,84,.9)' : 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * inR, cy + Math.sin(a) * inR); ctx.lineTo(cx + Math.cos(a) * outR, cy + Math.sin(a) * outR); ctx.stroke();
  }
  ctx.strokeStyle = '#ff5c54'; ctx.lineWidth = 5; ctx.shadowColor = '#ff5c54'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(av) * (r - 30), cy + Math.sin(av) * (r - 30)); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx, cy, 14, 0, 7); ctx.fill();
  text(String(Math.round(value * max)), cx, cy + r * 0.45, 46, 1, 700);
  text(unit, cx, cy + r * 0.45 + 38, 20, .55, 600);
  text(label, cx, cy - r * 0.35, 18, .45, 600);
}
function sceneEngine(t, o) {
  bg('#05070c', '#000');
  radial(W / 2, H / 2, W * .5, 'rgba(40,60,110,.35)', 'rgba(0,0,0,0)');
  const sweep = t < 0.4 ? 0 : t < 1.3 ? ease(span(t, .4, 1.3)) : t < 2.3 ? 1 - ease(span(t, 1.3, 2.3)) : 0;
  const idle = t > 2.3 ? 0.08 + Math.sin(t * 9) * 0.004 : 0;
  gauge(330, 320, 210, Math.max(sweep, idle), 'VÒNG TUA', 'x1000 rpm', 8, .8);
  gauge(W - 330, 320, 210, sweep, 'TỐC ĐỘ', 'km/h', 220, .9);
  // den bao tu kiem tra: sang het roi tat dan (nhu bat chia khoa)
  const lights = [['⛽', '255,180,0'], ['🔋', '255,92,84'], ['⚠️', '255,180,0'], ['ABS', '255,180,0'], ['🛞', '255,180,0'], ['🔆', '80,200,255']];
  lights.forEach((l, i) => {
    const off = 1 - span(t, 1.4 + i * .12, 1.7 + i * .12);
    const a = t < .3 ? span(t, 0, .3) : off;
    text(l[0], W / 2 - 200 + i * 80, 120, 34, a * .95, 700, l[1]);
  });
  const a = span(t, 2.2, 2.9);
  text(o.car, W / 2, 300 - 10 * (1 - out(a)), 70, a, 800);
  text(o.name ? `Xe của bạn đã sẵn sàng, ${o.name}` : 'Xe của bạn đã sẵn sàng', W / 2, 390, 30, span(t, 2.6, 3.3), 600);   // khong loi chao, khong gio
}

// ---------------------------------------------------------------- 2. Ánh sáng chào
const CAR = [[0, .78], [.05, .74], [.12, .7], [.22, .62], [.36, .44], [.52, .40], [.66, .44], [.8, .58], [.94, .62], [1, .7], [1, .78]];
function sceneWelcome(t, o) {
  const k = o.tempo;
  bg('#020308', '#06070d');
  const cx = W / 2, w = 900, h = 420, x0 = cx - w / 2, y0 = 40;
  const pts = CAR.map(([u, v]) => [x0 + u * w, y0 + v * h]);
  let len = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); len += d; }
  const p = ease(span(t, .2 * k, 1.8 * k));
  // duong sang chay tu giua ra 2 phia
  ctx.save();
  ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#fff'; ctx.shadowColor = 'rgba(160,210,255,.95)'; ctx.shadowBlur = 30;
  const draw = (from, to) => {
    let acc = 0; ctx.beginPath(); let started = false;
    for (let i = 1; i < pts.length; i++) {
      const a = acc, b = acc + seg[i - 1]; acc = b;
      if (b < from || a > to) continue;
      const s = clamp((from - a) / seg[i - 1]), e = clamp((to - a) / seg[i - 1]);
      const P = (q) => [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * q, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * q];

    ctx.stroke();
  };
  draw(len / 2 - p * len / 2, len / 2 + p * len / 2);
  // banh xe
  const wheel = span(t, 1.6 * k, 2.2 * k);
  [[.22, .78], [.78, .78]].forEach(([u, v]) => { ctx.globalAlpha = wheel; ctx.beginPath(); ctx.arc(x0 + u * w, y0 + v * h, 55, Math.PI, 0); ctx.stroke(); });
  ctx.restore();
  // den pha nhay 2 lan
  const flash = (t > 2.2 * k && t < 2.35 * k) || (t > 2.5 * k && t < 2.65 * k) ? 1 : 0;
  if (flash) { const fx = x0 + .96 * w, fy = y0 + .66 * h; const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 260); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  // duong chan troi
  ctx.fillStyle = `rgba(160,210,255,${.25 * span(t, 1.2 * k, 2 * k)})`; ctx.fillRect(0, y0 + .78 * h + 56, W, 2);
  text(`${greet()}, ${o.name}`, cx, 545, 44, span(t, 2.7 * k, 3.4 * k), 700);
}

// ---------------------------------------------------------------- 3. Thời tiết sống động
let drops = [], stars = [], fogs = [];
function initWeather() {
  drops = Array.from({ length: 160 }, () => ({ x: rnd(0, W), y: rnd(0, H), r: rnd(3, 9), v: rnd(0, 1) }));
  stars = Array.from({ length: 140 }, () => ({ x: rnd(0, W), y: rnd(0, H * .7), r: rnd(.6, 2), p: rnd(0, 6) }));
  fogs = Array.from({ length: 6 }, (_, i) => ({ y: 120 + i * 80, s: rnd(20, 60), o: rnd(0, W) }));
}
function weatherInfo(o) {
  return { rain: ['🌧', '24°', 'Mưa vừa · 80% khả năng mưa'], sun: ['☀️', '33°', 'Nắng · cao 34° thấp 27°'],
    night: ['🌙', '26°', 'Trời quang · sao rõ'], fog: ['🌫', '19°', 'Sương mù · đi chậm, bật đèn'] }[o.weather];
}
function sceneWeather(t, o) {
  const w = o.weather, info = weatherInfo(o);
  if (w === 'sun') { bg('#2a7fd8', '#9fd3ff'); }
  else if (w === 'night') { bg('#02030a', '#0b1230'); }
  else if (w === 'fog') { bg('#5f6670', '#9aa1aa'); }
  else { bg('#1c2633', '#33404f'); }
  if (w === 'sun') {
    const cx = W - 260, cy = 150;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .25);
    for (let i = 0; i < 12; i++) { ctx.rotate(Math.PI / 6); ctx.fillStyle = 'rgba(255,240,180,.18)'; ctx.fillRect(0, -14, 520, 28); }
    ctx.restore();

  }
  if (w === 'night') {
    stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${.4 + .6 * Math.abs(Math.sin(t * 2 + s.p))})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); });
    radial(W - 260, 140, 120, 'rgba(255,255,230,.95)', 'rgba(255,255,230,0)');
  }
  if (w === 'fog') {
    fogs.forEach(f => { ctx.fillStyle = 'rgba(255,255,255,.18)'; const x = (f.o + t * f.s * 3) % (W + 600) - 600; ctx.beginPath(); ctx.ellipse(x + 300, f.y, 420, 50, 0, 0, 7); ctx.fill(); });
  }
  // noi dung
  const a = span(t, .6, 1.3);

  text(info[1], 300, 430, 110, a, 800);
  text(`${greet()}, ${o.name}`, W / 2 + 160, 230, 54, span(t, .9, 1.6), 700);
  text(info[2], W / 2 + 160, 310, 30, span(t, 1.2, 1.9) * .85, 500);

  // mua tren kinh + can gat nuoc quet qua lo ra noi dung
  if (w === 'rain') {
    const wipe = t < 1.0 ? 0 : t < 1.9 ? ease(span(t, 1.0, 1.9)) : t < 2.6 ? 1 - ease(span(t, 1.9, 2.6)) : 0;
    const cleared = t < 1.0 ? 0 : t < 1.9 ? wipe : 1;   // vung da gat giu sach khi can gat quay ve

    ctx.clip('evenodd');
    ctx.fillStyle = 'rgba(30,40,55,.55)'; ctx.fillRect(0, 0, W, H);   // kinh mo hoi nuoc

      const y = (d.y + (t * 60 * d.v)) % H;
      const g = ctx.createRadialGradient(d.x - d.r * .3, y - d.r * .3, 0, d.x, y, d.r);
      g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(180,200,220,.15)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(d.x, y, d.r * .8, d.r, 0, 0, 7); ctx.fill();
    });
    ctx.restore();

    ctx.strokeStyle = '#0b0b0d'; ctx.lineWidth = 16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(L, 0); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(60, -6); ctx.lineTo(L, -6); ctx.stroke();

}

// ---------------------------------------------------------------- 4. Hạt sáng tụ chữ
let parts = [], partsFor = '';
function buildParticles(s) {

  c.fillText(s, W / 2, H / 2 - 20);

  for (let y = 0; y < H; y += 6) for (let x = 0; x < W; x += 6) if (img[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  parts = pts.map(([x, y]) => ({ tx: x, ty: y, sx: rnd(-200, W + 200), sy: rnd(-200, H + 200), d: rnd(0, .5), hue: rnd(190, 230) }));
  partsFor = s;
}
function sceneParticles(t, o) {
  if (partsFor !== o.name) buildParticles(o.name);

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = out(span(t, .2 + p.d, 1.8 + p.d));
    const leave = ease(span(t, 4.1, 4.9));
    let x = p.sx + (p.tx - p.sx) * k, y = p.sy + (p.ty - p.sy) * k;
    x += Math.sin(t * 3 + p.tx * .02) * 1.5 * k; y += leave * (p.ty - H / 2) * .6 - leave * 140;
    const a = (1 - leave) * (.35 + .65 * k);
    ctx.fillStyle = `hsla(${p.hue},100%,${70 + 30 * Math.sin(t * 4 + p.tx)}%,${a})`;
    ctx.fillRect(x, y, 3.2, 3.2);
  }
  ctx.restore();
  text(greet(), W / 2, 500, 32, span(t, 2.0, 2.6) * (1 - span(t, 4.1, 4.6)), 600);
}

// ---------------------------------------------------------------- 5. Dịp đặc biệt
let bursts = [], petals = [], confetti = [], snow = [];
function initFestive() {
  bursts = Array.from({ length: 7 }, (_, i) => ({ x: rnd(200, W - 200), y: rnd(80, 300), t: .3 + i * .55, hue: [0, 45, 55, 330, 20, 200, 120][i], n: 70 }));
  petals = Array.from({ length: 40 }, () => ({ x: rnd(0, W), y: rnd(-H, 0), s: rnd(10, 18), v: rnd(60, 120), r: rnd(0, 6), sw: rnd(1, 3) }));
  confetti = Array.from({ length: 160 }, () => ({ x: rnd(0, W), y: rnd(-H, 0), v: rnd(120, 260), c: `hsl(${rnd(0, 360)},90%,60%)`, r: rnd(0, 6), w: rnd(8, 16) }));

}
function firework(b, t) {
  const age = t - b.t; if (age < 0 || age > 2) return;
  if (age < .4) { const y = H - (H - b.y) * out(age / .4); ctx.fillStyle = 'rgba(255,240,200,.9)'; ctx.fillRect(b.x - 2, y, 4, 14); return; }

}
function sceneFestive(t, o) {

    petals.forEach(p => {   // hoa mai roi

      ctx.fillStyle = '#e8590c'; ctx.beginPath(); ctx.arc(0, 0, p.s * .18, 0, 7); ctx.fill(); ctx.restore();
    });

  } else if (occ === 'birthday') {
    bg('#1b0b3a', '#3b1a78');
    confetti.forEach(c => { const y = c.y + t * c.v; ctx.save(); ctx.translate(c.x + Math.sin(t * 2 + c.r) * 20, y % (H + 30)); ctx.rotate(t * 3 + c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -3, c.w, 6); ctx.restore(); });

    text('🎄', W / 2, 190, 120, out(span(t, .3, 1)));

// ---------------------------------------------------------------- 6. HUD tự kiểm tra
function sceneHud(t, o) {
  bg('#01050c', '#04121e');

// ---------------------------------------------------------------- 7. Bảng tin buổi sáng
function card(x, y, w, h, a, dy) {

function sceneBriefing(t, o) {

// ---------------------------------------------------------------- bang chon
const STYLES = [
  { id: 'engine', name: 'Khởi động máy', fn: sceneEngine, d: 4.5,

    tags: ['Dễ làm', 'Rất "xe"'] },
  { id: 'welcome', name: 'Ánh sáng chào', fn: sceneWelcome, d: 4.5,

let cur = STYLES[0], t0 = performance.now();
function opts() { return { name: $('name').value || 'An', car: $('car').value || 'OmniCar', weather: $('weather').value, occasion: $('occasion').value, tempo: +$('tempo').value }; }
function replay() { t0 = performance.now(); initWeather(); initFestive(); }
function select(s) {

}
STYLES.forEach(s => { const b = document.createElement('button'); b.className = 'tab'; b.textContent = s.name; b.dataset.id = s.id; b.onclick = () => select(s); $('tabs').appendChild(b); });
$('replay').onclick = replay; cv.onclick = replay;
['weather', 'occasion', 'tempo', 'name', 'car'].forEach(id => $(id).addEventListener('input', replay));
// #weather@1.5 = mo kieu "weather" va dung hinh o giay 1.5 (de chup man hinh / so sanh)
const pin = location.hash.match(/^#(\w+)@([\d.]+)$/);
function frame(now) {

}
select(STYLES.find(s => pin && s.id === pin[1]) || STYLES[0]);
requestAnimationFrame(frame);
</script>

  Ban phim tren man xe (Features/AppBridge/ABKeyboard.mm) theo UI/UX ban phim HarmonyOS (giao dien toi):
  - khung nhu ban phim HarmonyOS: the noi bo 4 goc (20), cach mep 6, kin be rong o app; cao ~78% man
  - kinh trang, phim trang bo 7, phim chuc nang tim nhat, hang so rieng, goi y nho goc phim, phim , . tim nhat
  - cham phim chu: bong bong phong to ky tu phia tren phim; phim lun 0,96 roi nay lai
  - Shift dang bat / Enter: gradient tim -> xanh troi, chu trang (DESIGN.md)
  - hien: truot len tu mep duoi (duong cong HarmonyOS 'friction' 0.2,0,0.2,1, 350 ms); an: truot xuong 250 ms
  Dung cho moi app tren man xe: app iPhone (App Bridge) va app CarPlay goc (nut tren). Do theo pt, phong to 2x.
-->
<style>
:root { --page: #0f1115; --text: #e8eaef; --muted: #8b93a3;
  --hm-in: cubic-bezier(.2, 0, .2, 1); --hm-spring: cubic-bezier(.25, 1.35, .45, 1);
  /* KB mau: kinh trang cua giao dien moi (= tools/preview/theme.html, ABKeyboard.mm) */
  --kb-bg: rgba(255,255,255,.38); --kb-line: rgba(255,255,255,.85); --key: rgba(255,255,255,.92); --key-fn: rgba(214,210,240,.75); --key-soft: #d9d3ff; --key-down: #e4e2f2;
  --kb-text: #1f2233; --kb-fn-text: #4a4f6a; --kb-hint: #9aa0b8; --acc: linear-gradient(135deg, #8b7cff, #5ab8ff); --acc-down: linear-gradient(135deg, #7a6ce6, #4ea4e6); --acc-text: #fff; --bubble: #fff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 14px; min-height: 100vh; }
h1 { font-size: 16px; font-weight: 600; margin: 0; }
.top { width: 100%; max-width: 1340px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.top small { color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns button { background: #1d212a; color: var(--text); border: 1px solid #2a303b; border-radius: 9px; padding: 6px 12px; font: inherit; cursor: pointer; }
.btns button.on { background: #e8eaef; color: #111; }

.bezel { background: #050506; border-radius: 22px; padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px #1d1f24; max-width: 100%; }
.fit { position: relative; overflow: hidden; border-radius: 10px; }
#screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none;
  font-family: "HarmonyOS Sans", -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }

#dock { position: absolute; left: 0; top: 0; bottom: 0; width: 45px; background: #101114; display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 6px; z-index: 2; }
#dock .t { color: #fff; font-size: 10px; font-weight: 600; }
#dock .d { width: 30px; height: 30px; border-radius: 8px; }
#dock .sp { flex: 1; }
#dock .g { width: 18px; height: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
#dock .g i { background: #c9cdd4; border-radius: 1px; }

/* Nen sau ban phim: app iPhone (YouTube) hoac app CarPlay goc (Ban do) */
#app { position: absolute; top: 0; bottom: 0; right: 0; overflow: hidden; }
#app.bridge { background: radial-gradient(circle at 30% 40%, #2b3a2e 0 18%, transparent 19%), radial-gradient(circle at 75% 70%, #2a3343 0 22%, transparent 23%),
    repeating-linear-gradient(35deg, #1b1e22 0 22px, #22262b 22px 24px), #1b1e22; }
#app.native { background: linear-gradient(160deg, #e9e4d8, #d9e4cf 40%, #cfdbe6); }
#app .search { position: absolute; left: 12px; right: 12px; top: 10px; height: 30px; border-radius: 10px; background: rgba(255,255,255,.92); color: #333; font-size: 12px; display: flex; align-items: center; padding: 0 10px; }
#app.native .search { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); left: 50%; width: 260px; margin-left: -130px; border-radius: 15px; }
#app .road { position: absolute; background: #fff; height: 7px; border-radius: 4px; box-shadow: 0 0 0 1px #d0d0d0; }

/* ===== KB ===== */
#kb { position: absolute; border-radius: 20px; background: var(--kb-bg); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
  box-shadow: inset 0 .5px 0 var(--kb-line), 0 -6px 24px rgba(70,60,140,.3);
  transform: translateY(0); transition: transform .35s var(--hm-in); }
#kb.hide { transform: translateY(105%); transition: transform .25s var(--hm-in); }
#bar { position: absolute; left: 6px; right: 6px; top: 5px; height: 24px; display: flex; align-items: center; gap: 2px; }
#field { flex: 1; height: 24px; border-radius: 12px; background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px rgba(31,34,51,.06); display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 500; color: var(--kb-text); overflow: hidden; white-space: nowrap; }
#field.ph { color: var(--kb-hint); }
#field .caret { display: inline-block; width: 1.5px; height: 13px; background: #8b7cff; margin-left: 1px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.tb { height: 24px; min-width: 30px; padding: 0 5px; display: grid; place-items: center; color: #6b7090; cursor: pointer; border-radius: 12px; font-size: 11px; font-weight: 600;
  transition: background .15s, transform .2s var(--hm-spring); }
.tb:active { background: rgba(31,34,51,.08); transform: scale(.92); }
.tb svg { width: 18px; height: 18px; }
.chip { border: 1px solid rgba(31,34,51,.25); border-radius: 6px; padding: 0 4px; line-height: 14px; font-size: 10px; }
#keys { position: absolute; left: 5px; right: 5px; bottom: 5px; }
.k { position: absolute; border-radius: 7px; display: grid; place-items: center; color: var(--kb-text); cursor: pointer; background: var(--key); font-weight: 400; box-shadow: inset 0 0 0 .5px rgba(139,124,255,.55), 0 1px 1px rgba(31,34,51,.18);
  transition: background .12s, transform .25s var(--hm-spring); }
.k.fn { background: var(--key-fn); font-size: 10.5px; font-weight: 600; color: var(--kb-fn-text); }
.k.soft { background: var(--key-soft); }
.k.space { font-size: 10px; color: var(--kb-hint); }
.k.acc, .k.on { background: var(--acc); color: var(--acc-text); box-shadow: 0 4px 12px rgba(110,120,255,.45); }
.k.down { background: var(--key-down); transform: scale(.96); transition: background .05s, transform .08s var(--hm-in); }
.k.acc.down, .k.on.down { background: var(--acc-down); }
.k svg { width: 15px; height: 15px; }
.k .h { position: absolute; right: 3px; top: 1px; font-size: 7.5px; color: var(--kb-hint); line-height: 1.1; }

/* Bong bong phong to khi cham phim chu (HarmonyOS): nam tren phim, chu to, bong mem */
#bubble { position: absolute; display: none; z-index: 5; pointer-events: none; border-radius: 9px; background: var(--bubble); color: var(--kb-text);
  box-shadow: 0 6px 18px rgba(70,60,140,.3); text-align: center; font-weight: 400; transform-origin: 50% 100%; animation: pop .14s var(--hm-spring); }
#bubble.show { display: block; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.notes { max-width: 1340px; width: 100%; color: var(--muted); font-size: 13px; }
.notes b { color: var(--text); }
.notes ul { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<div class="top">
  <h1>Bàn phím trên màn xe · UI/UX HarmonyOS <small>(bấm phím thử được)</small></h1>
  <div class="btns">
    <button data-app="bridge" class="on">App iPhone (YouTube)</button>
    <button data-app="native">App CarPlay (Bản đồ)</button>
    <button data-size="640x240" class="on">Màn 640×240</button>
    <button data-size="800x480">Màn 800×480</button>
    <button id="toggle">Ẩn / hiện</button>
  </div>
</div>
<div class="bezel"><div class="fit" id="fit"><div id="screen">
  <div id="dock"><div class="t">9:41</div><div class="d" style="background:#2fb24c"></div><div class="d" style="background:#ff375f"></div><div class="d" style="background:#0a84ff"></div><div class="sp"></div><div class="g"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div id="app" class="bridge"><div class="search">Tìm kiếm trên YouTube</div></div>
  <div id="kb">
    <div id="bar"><div id="field"></div><div class="tb" id="langTb"></div><div class="tb" id="hideBtn"></div></div>
    <div id="keys"></div>
    <div id="bubble"></div>
  </div>
</div></div></div>
<div class="notes">
  <b>Lần này</b>
  <ul>
    <li>Khung như bàn phím HarmonyOS: thẻ nổi bo tròn 4 góc (20), cách mép ô app và mép dưới 6 pt, kín bề rộng ô app; cao ~78% màn.</li>
    <li>Chạm phím chữ: bong bóng phóng to ký tự hiện trên phím (như HarmonyOS); phím lún nhẹ rồi nảy lại.</li>
    <li>Hiện: trượt lên từ mép dưới theo đường cong HarmonyOS (350 ms); ẩn: trượt xuống (250 ms).</li>
    <li>Icon nét mảnh bo tròn kiểu HarmonyOS: Shift, xoá, quả địa cầu, Enter, ẩn bàn phím.</li>
    <li>Dùng cho mọi app trên màn xe: app iPhone (App Bridge) và app CarPlay gốc (Bản đồ, Spotify…) — nút trên để xem.</li>
  </ul>
</div>
<script>
// Icon kieu HarmonyOS: net 1.6, dau bo tron
const I = (d, fill) => `<svg viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const SVG = {
  hide: I('<rect x="3.5" y="4" width="17" height="11" rx="2.5"/><path d="M7.5 8h.01M10.5 8h.01M13.5 8h.01M16.5 8h.01M9 11.5h6M9.5 18.5l2.5 2 2.5-2"/>'),
  shift: I('<path d="M12 4.2 4.6 11.6a.6.6 0 0 0 .4 1H8.5V18a1.5 1.5 0 0 0 1.5 1.5h4A1.5 1.5 0 0 0 15.5 18v-5.4H19a.6.6 0 0 0 .4-1z"/>', true),
  shiftO: I('<path d="M12 4.2 4.6 11.6a.6.6 0 0 0 .4 1H8.5V18a1.5 1.5 0 0 0 1.5 1.5h4A1.5 1.5 0 0 0 15.5 18v-5.4H19a.6.6 0 0 0 .4-1z"/>'),
  del: I('<path d="M9 5.5h10a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-6-6.5z"/><path d="m11.5 9.5 5 5m0-5-5 5"/>'),
  globe: I('<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5s1.2-6.1 3.5-8.5z"/>'),
  ret: I('<path d="M19.5 5.5v6a2.5 2.5 0 0 1-2.5 2.5H5.5"/><path d="m9.5 10-4 4 4 4"/>')
};
// Goi y goc phim: Telex (tieng Viet) / ky hieu (tieng Anh) - giong ABKHint() trong ABKeyboard.mm
const TELEX = { s: '´', f: '`', r: '?', x: '~', j: '.', w: 'ư', d: 'đ', a: 'â', e: 'ê', o: 'ô' };
const SYM = { q: '%', w: '\\', e: '|', r: '=', t: '[', y: ']', u: '<', i: '>', o: '{', p: '}', a: '@', s: '#', d: '&', f: '*', g: '-', h: '+', j: '(', k: ')', l: '"', z: '_', x: '$', c: "'", v: ':', b: ';', n: '!', m: '?' };
const S = { w: 640, h: 240, dock: 45, numbers: false, shift: false, vi: true, typed: '', app: 'bridge' };
const scr = document.getElementById('screen'), kb = document.getElementById('kb'), keysEl = document.getElementById('keys'), field = document.getElementById('field'), bubble = document.getElementById('bubble');
document.getElementById('hideBtn').innerHTML = SVG.hide;

// KB: so do giong layoutPanelIn / layoutKeys trong ABKeyboard.mm
const KB = { hFrac: .78, maxH: 280, top: 33, pad: 5, gapX: 5, gapY: 5 };
function layout() {
  const appX = S.dock, appW = S.w - S.dock;
  scr.style.width = S.w + 'px'; scr.style.height = S.h + 'px';
  const app = document.getElementById('app'); app.style.left = appX + 'px'; app.className = S.app;
  app.innerHTML = S.app === 'native'
    ? '<div class="road" style="left:-10px;right:-10px;top:120px;transform:rotate(-8deg)"></div><div class="road" style="left:200px;width:7px;height:260px;top:-20px"></div><div class="search">Tìm kiếm</div>'
    : '<div class="search">Tìm kiếm trên YouTube</div>';
  const w = appW - 12, h = Math.min(Math.floor(S.h * KB.hFrac), KB.maxH);   // khung HarmonyOS: the noi bo 4 goc, cach mep 6
  Object.assign(kb.style, { left: (appX + 6) + 'px', top: (S.h - h - 6) + 'px', width: w + 'px', height: h + 'px' });
  keysEl.style.top = KB.top + 'px';
  const scale = Math.min(2, (Math.min(window.innerWidth, 1340) - 60) / S.w);
  scr.style.transform = `scale(${scale})`;
  const fit = document.getElementById('fit'); fit.style.width = S.w * scale + 'px'; fit.style.height = S.h * scale + 'px';
  build();
}
function build() {
  document.getElementById('langTb').innerHTML = `<span class="chip">${S.vi ? 'VI' : 'EN'}</span>`;
  keysEl.innerHTML = '';
  const up = c => S.shift ? c.toUpperCase() : c;
  const lines = S.numbers ? ['1234567890', '[]{}#%^*+=', '-/:;()$&@"', '.,?!\''] : ['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
  const rows = lines.map((line, r) => [...line].map(c => {
    const t = S.numbers || r === 0 ? c : up(c);
    return { t, v: t, w: 1, pop: 1, h: S.numbers || r === 0 ? '' : (S.vi ? TELEX[c] : SYM[c]) || '' };
  }));
  const last = rows.length - 1;
  rows[last].unshift(S.numbers ? { t: '#', v: '#', w: 1.5, fn: 1 } : { t: S.shift ? SVG.shift : SVG.shiftO, cmd: 'shift', w: 1.5, fn: 1, on: S.shift });
  rows[last].push({ t: SVG.del, cmd: 'del', w: 1.5, fn: 1 });
  rows.push([{ t: S.numbers ? 'ABC' : '#+=', cmd: 'mode', w: 1.4, fn: 1 }, { t: SVG.globe, cmd: 'lang', w: 1.1, fn: 1 },
    { t: ',', v: ',', w: 1, cls: 'soft' }, { t: S.vi ? 'Tiếng Việt · Telex' : 'space', v: ' ', cls: 'space', w: 4.2 },
    { t: '.', v: '.', w: 1, cls: 'soft' }, { t: SVG.ret, cmd: 'ret', cls: 'acc', w: 1.8 }]);
  const W = kb.clientWidth - KB.pad * 2, H = kb.clientHeight - KB.top - KB.pad, n = rows.length;
  const rowH = Math.floor((H - KB.gapY * (n - 1)) / n), unit = (W - KB.gapX * 9) / 10;
  rows.forEach((row, r) => {
    const total = row.reduce((a, k) => a + k.w, 0), avail = W - KB.gapX * (row.length - 1);
    const u = (r >= n - 2 || row.length >= 10) ? avail / total : Math.min(unit, avail / total);
    let x = (W - (u * total + KB.gapX * (row.length - 1))) / 2;
    row.forEach(k => {
      const el = document.createElement('div');
      el.className = 'k' + (k.fn ? ' fn' : '') + (k.cls ? ' ' + k.cls : '') + (k.on ? ' on' : '');
      el.innerHTML = k.t + (k.h ? `<span class="h">${k.h}</span>` : '');
      const box = { x, y: r * (rowH + KB.gapY), w: u * k.w, h: rowH };
      Object.assign(el.style, { left: box.x + 'px', top: box.y + 'px', width: box.w + 'px', height: box.h + 'px', fontSize: k.fn || k.cls === 'space' ? '' : Math.round(rowH * .56) + 'px' });
      el.onpointerdown = () => { el.classList.add('down'); if (k.pop) showBubble(k, box); };
      el.onpointerleave = () => { el.classList.remove('down'); hideBubble(); };
      el.onpointerup = () => { el.classList.remove('down'); hideBubble(); tap(k); };
      keysEl.appendChild(el); x += u * k.w + KB.gapX;
    });
  });
  showField();
}
// Bong bong: rong 1.3 phim, cao 1.45 phim, day bong bong ngang mep tren phim; khong ra ngoai ban phim theo chieu ngang
function showBubble(k, b) {
  const bw = Math.round(b.w * 1.3), bh = Math.round(b.h * 1.45);
  const left = Math.min(Math.max(KB.pad + b.x + b.w / 2 - bw / 2, 2), kb.clientWidth - bw - 2);
  Object.assign(bubble.style, { left: left + 'px', top: (KB.top + b.y - bh + 2) + 'px', width: bw + 'px', height: bh + 'px', lineHeight: bh * .8 + 'px', fontSize: Math.round(b.h * .85) + 'px' });
  bubble.textContent = k.t;
  bubble.classList.remove('show'); void bubble.offsetWidth; bubble.classList.add('show');
}
function hideBubble() { bubble.classList.remove('show'); }
function tap(k) {
  if (!k.cmd) { S.typed += k.v; if (S.shift) { S.shift = false; build(); } }
  else if (k.cmd === 'del') S.typed = S.typed.slice(0, -1);
  else if (k.cmd === 'shift') { S.shift = !S.shift; build(); }
  else if (k.cmd === 'mode') { S.numbers = !S.numbers; S.shift = false; build(); }
  else if (k.cmd === 'lang') { S.vi = !S.vi; build(); }
  else if (k.cmd === 'ret') S.typed = '';
  showField();
}
function showField() {
  field.className = S.typed ? '' : 'ph';
  field.innerHTML = S.typed ? `<span>${S.typed.replace(/&/g, '&amp;').replace(/</g, '&lt;')}<i class="caret"></i></span>` : `<span>${S.vi ? 'Gõ tiếng Việt kiểu Telex' : 'Type into the app'}</span>`;
  field.scrollLeft = field.scrollWidth;
}
document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-size]').forEach(x => x.classList.toggle('on', x === b));
  [S.w, S.h] = b.dataset.size.split('x').map(Number); S.dock = S.h > 300 ? 76 : 45; layout();
});
document.querySelectorAll('[data-app]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-app]').forEach(x => x.classList.toggle('on', x === b));
  S.app = b.dataset.app; layout();
});
document.getElementById('langTb').onclick = () => { S.vi = !S.vi; build(); };
document.getElementById('toggle').onclick = () => kb.classList.toggle('hide');
document.getElementById('hideBtn').onclick = () => { kb.classList.add('hide'); setTimeout(() => kb.classList.remove('hide'), 900); };
window.onresize = layout;
layout();
</script>
</body>
</html>
</template>

<script>
// Mo tab theo #hash: tao iframe lan dau tu template (giu trang thai khi doi tab), iframe tu cao theo noi dung
const frames = {};
const FIX = '<style>body{min-height:0!important}</style>';
function sizer(k) {
  return '<script>(function(){function p(){parent.postMessage({omcFrame:"' + k + '",h:document.documentElement.scrollHeight},"*")}'
    + 'addEventListener("load",function(){p();new ResizeObserver(p).observe(document.body)});addEventListener("resize",p)})()<\/script>';
}
function show(k) {
  const t = document.getElementById('m-' + k) || document.getElementById('m-overview');
  k = t.id.slice(2);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === k));
  document.getElementById('desc').textContent = t.dataset.desc;
  document.title = 'OmniCar Preview · ' + t.dataset.name;
  Object.entries(frames).forEach(([n, f]) => f.style.display = n === k ? '' : 'none');
  if (!frames[k]) {
    const f = document.createElement('iframe');
    f.title = t.dataset.name;
    f.srcdoc = '<!doctype html>' + FIX + sizer(k) + t.innerHTML;
    document.getElementById('main').appendChild(f);
    frames[k] = f;
  }
}
addEventListener('message', e => { const d = e.data; if (d && d.omcFrame && frames[d.omcFrame]) frames[d.omcFrame].style.height = Math.ceil(d.h) + 'px'; });
addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || 'overview');
</script>
</body>
</html>
