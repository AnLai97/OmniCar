<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniCar Logo</title>
<!--
  Logo OmniCar kieu chat long 3D + kinh mo (glassmorphism) ket hop mau HarmonyOS. Cung hinh logo hien tai
  (tools/icons/omnicar_logo_glass.ps1): vong tron ban kinh ngoai 360 day 120 + nut play bo goc (cao 610, bo 48, cat
  vien 700 / 60) tren o squircle n=5, khung 1024. Moi phuong an ve bang SVG (khong can Python); phuong an duoc chon
  se duoc ve lai bang .NET (tools/icons/) ra PNG.
-->
<style>
:root { --page: #0f1115; --text: #e8eaef; --muted: #8b93a3; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
body { padding: 20px 16px 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; }
h1 { font-size: 18px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 4px; }
.sub { color: var(--muted); max-width: 980px; text-align: center; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; width: 100%; max-width: 1180px; }
.card { background: #171a21; border: 1px solid #242935; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.card .big svg { width: 200px; height: 200px; display: block; filter: drop-shadow(0 14px 26px rgba(0,0,0,.45)); }
.card .tag { font-weight: 700; font-size: 15px; }
.card .desc { color: var(--muted); font-size: 12.5px; text-align: center; min-height: 54px; }
.sizes { display: flex; gap: 14px; align-items: flex-end; }
.sizes svg { display: block; }
.homes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; width: 100%; max-width: 1180px; }
.home { border-radius: 22px; padding: 22px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px 8px; justify-items: center; }
.home.dark { background: radial-gradient(circle at 20% 10%, #3b2a7a, transparent 55%), radial-gradient(circle at 90% 90%, #0d5d78, transparent 55%), #0b0c12; }
.home.light { background: radial-gradient(circle at 15% 15%, #d9d2ff, transparent 55%), radial-gradient(circle at 85% 85%, #c6f0ff, transparent 55%), #f3f4fa; }
.app { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; }
.home.dark .app { color: #fff; } .home.light .app { color: #222; }
.app svg { width: 60px; height: 60px; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
.app .ph { width: 60px; height: 60px; border-radius: 15px; }
.pal { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 1180px; }
.sw { width: 132px; border-radius: 14px; overflow: hidden; background: #171a21; border: 1px solid #242935; font-size: 12px; }
.sw i { display: block; height: 54px; }
.sw div { padding: 6px 9px; } .sw b { display: block; font-size: 12.5px; } .sw span { color: var(--muted); }
</style>
</head>
<body>
<h1>Logo OmniCar · chất lỏng 3D + kính mờ, màu HarmonyOS</h1>
<p class="sub">Giữ hình logo hiện tại (vòng tròn + nút play CarPlay). 4 phương án — chọn 1, rồi bảng màu của nó dùng cho toàn bộ tweak (Settings, khay bố cục, bàn phím, màn hình khởi động…).</p>
<div class="grid" id="grid"></div>
<h2>Trên màn hình chính</h2>
<div class="homes"><div class="home dark" id="homeD"></div><div class="home light" id="homeL"></div></div>
<h2>Bảng màu đề xuất (lấy từ logo)</h2>
<div class="pal" id="pal"></div>
<script>
// ---- Hinh: squircle n=5, vong tron, nut play bo goc (giong SCPCRoundedTriangle / omnicar_logo_glass.ps1) ----
function squircle(s = 1) {
  const h = 512, n = 5; let d = '';
  for (let i = 0; i < 360; i++) {
    const t = 2 * Math.PI * i / 360, c = Math.cos(t), si = Math.sin(t);
    const x = h + h * s * Math.sign(c) * Math.pow(Math.abs(c), 2 / n), y = h + h * s * Math.sign(si) * Math.pow(Math.abs(si), 2 / n);
    d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return d + 'Z';
}
function tri(cx, cy, h, r) {
  const w = h * .9, p = [[cx - w / 2 + w / 6, cy - h / 2], [cx - w / 2 + w / 6, cy + h / 2], [cx + w / 2 + w / 6, cy]];
  let d = '';
  for (let i = 0; i < 3; i++) {
    const pr = p[(i + 2) % 3], cu = p[i], nx = p[(i + 1) % 3];
    let ax = pr[0] - cu[0], ay = pr[1] - cu[1], bx = nx[0] - cu[0], by = nx[1] - cu[1];
    const la = Math.hypot(ax, ay), lb = Math.hypot(bx, by); ax /= la; ay /= la; bx /= lb; by /= lb;
    const th = Math.acos(Math.max(-1, Math.min(1, ax * bx + ay * by))), dd = r / Math.tan(th / 2);
    const a = [cu[0] + ax * dd, cu[1] + ay * dd], b = [cu[0] + bx * dd, cu[1] + by * dd];
    d += (i ? 'L' : 'M') + a.map(v => v.toFixed(1)).join(' ') + 'Q' + cu.join(' ') + ' ' + b.map(v => v.toFixed(1)).join(' ');
  }
  return d + 'Z';
}
const RING = 'M152 512a360 360 0 1 0 720 0a360 360 0 1 0-720 0ZM272 512a240 240 0 1 0 480 0a240 240 0 1 0-480 0Z';
const TRI = tri(512, 512, 610, 48), CUT = tri(512, 512, 700, 60), SQ = squircle(), SQ_IN = squircle(.992);

// ---- 4 phuong an ----
const C = {
  aurora: { name: 'A · Cực quang', desc: 'Nền chất lỏng tím–xanh–lục lam–hồng chảy vào nhau; logo là kính mờ trắng nổi 3D, viền sáng, vệt bóng.',
    base: '#1b1446', blobs: [['#8B5CF6', 280, 260, 430], ['#2F6BFF', 790, 300, 400], ['#14C8E6', 760, 840, 380], ['#FF4FA3', 230, 820, 360], ['#5B3DF5', 520, 560, 260]],
    blur: 120, mark: 'glass', glassTint: .42 },
  night: { name: 'B · Đêm lỏng', desc: 'Nền tối gần đen, chất lỏng phát sáng ở nửa dưới; logo kính mờ. Hợp với giao diện tối hiện tại.',
    base: '#0b0c12', blobs: [['#7C3AED', 300, 900, 380], ['#2563EB', 700, 860, 360], ['#06B6D4', 860, 640, 260], ['#DB2777', 140, 600, 220]],
    blur: 110, mark: 'glass', glassTint: .34 },
  tube: { name: 'C · Ống chất lỏng', desc: 'Nền kính tối; chính vòng tròn và nút play là chất lỏng màu 3D (tím → xanh → lục lam → hồng) có vệt bóng.',
    base: '#15171e', blobs: [['#2a2f3d', 512, 200, 520]], blur: 90, mark: 'liquid' },
  light: { name: 'D · HarmonyOS sáng', desc: 'Nền pastel sáng (oải hương, xanh trời, bạc hà, đào) như hình nền HarmonyOS; logo kính trắng, viền và bóng mềm.',
    base: '#eef0fb', blobs: [['#B7A6FF', 260, 240, 420], ['#8FD3FF', 800, 320, 380], ['#9DF2D8', 760, 850, 360], ['#FFC2D6', 220, 830, 340]],
    blur: 110, mark: 'glass', glassTint: .55, light: true }
};
let uid = 0;
function logo(key, px) {
  const c = C[key], id = 'l' + (uid++);
  const blobs = (blur, op = 1) => `<g filter="url(#${id}b${blur})" opacity="${op}">${c.blobs.map(([col, x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>`).join('')}</g>`;
  const defs = `<defs>
    <clipPath id="${id}sq"><path d="${SQ}"/></clipPath>
    <filter id="${id}b${c.blur}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${c.blur}"/></filter>
    <filter id="${id}b${c.blur + 70}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${c.blur + 70}"/></filter>
    <filter id="${id}sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <mask id="${id}m"><rect width="1024" height="1024" fill="#000"/><path d="${RING}" fill="#fff" fill-rule="evenodd"/><path d="${CUT}" fill="#000"/><path d="${TRI}" fill="#fff"/></mask>
    <linearGradient id="${id}rim" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>
    <linearGradient id="${id}spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="${id}liq" x1="0.1" y1="0.1" x2="0.9" y2="0.95"><stop offset="0" stop-color="#A78BFA"/><stop offset=".35" stop-color="#3D7BFF"/><stop offset=".7" stop-color="#22D3EE"/><stop offset="1" stop-color="#FF5CA8"/></linearGradient>
    <radialGradient id="${id}shade" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".75" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
    <linearGradient id="${id}tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="${c.light ? .5 : .14}"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>`;
  // Hinh logo dung chung cho bong / vien / vet bong
  const markShape = `<rect width="1024" height="1024" mask="url(#${id}m)"`;
  let mark;
  if (c.mark === 'glass') {
    mark = `
      <g transform="translate(0 30)" opacity="${c.light ? .3 : .65}">${markShape} fill="#000" filter="url(#${id}sh)"/></g>
      <g mask="url(#${id}m)">
        <rect width="1024" height="1024" fill="${c.base}"/>${blobs(c.blur + 70)}
        <rect width="1024" height="1024" fill="#fff" opacity="${c.glassTint}"/>
        <ellipse cx="420" cy="230" rx="430" ry="220" fill="url(#${id}spec)" opacity=".55"/>
        <rect width="1024" height="1024" fill="url(#${id}shade)"/>
      </g>
      <path d="${RING}" fill="none" stroke="url(#${id}rim)" stroke-width="5" fill-rule="evenodd" mask="url(#${id}m)"/>
      <g mask="url(#${id}m)"><path d="${TRI}" fill="none" stroke="url(#${id}rim)" stroke-width="10"/><path d="${RING}" fill="none" stroke="url(#${id}rim)" stroke-width="10"/></g>`;
  } else {
    mark = `
      <g transform="translate(0 22)" opacity=".55">${markShape} fill="#000" filter="url(#${id}sh)"/></g>
      <g mask="url(#${id}m)">
        <rect width="1024" height="1024" fill="url(#${id}liq)"/>
        <rect width="1024" height="1024" fill="url(#${id}shade)"/>
        <ellipse cx="430" cy="250" rx="380" ry="170" fill="url(#${id}spec)" opacity=".6"/>
        <path d="${RING}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="10"/><path d="${TRI}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="10"/>
      </g>
      <g opacity=".5" filter="url(#${id}sh)" style="mix-blend-mode:screen">${markShape} fill="url(#${id}liq)"/></g>`;
  }
  return `<svg viewBox="0 0 1024 1024" width="${px}" height="${px}" xmlns="http://www.w3.org/2000/svg">${defs}
    <g clip-path="url(#${id}sq)">
      <rect width="1024" height="1024" fill="${c.base}"/>${blobs(c.blur)}
      <rect width="1024" height="1024" fill="url(#${id}tile)"/>
      ${mark}
    </g>
    <path d="${SQ_IN}" fill="none" stroke="#fff" stroke-opacity="${c.light ? .7 : .28}" stroke-width="6"/>
  </svg>`;
}

const grid = document.getElementById('grid');
for (const k in C) {
  const el = document.createElement('div'); el.className = 'card';
  el.innerHTML = `<div class="big">${logo(k, 200)}</div><div class="tag">${C[k].name}</div><div class="desc">${C[k].desc}</div>
    <div class="sizes">${logo(k, 60)}${logo(k, 40)}${logo(k, 29)}</div>`;
  grid.appendChild(el);
}
const others = [['#34c759', 'Điện thoại'], ['#ff3b30', 'Nhạc'], ['#0a84ff', 'Bản đồ'], ['#ff9500', 'Podcast']];
for (const [id, keys] of [['homeD', ['aurora', 'night', 'tube', 'light']], ['homeL', ['aurora', 'night', 'tube', 'light']]]) {
  const h = document.getElementById(id);
  keys.forEach(k => h.insertAdjacentHTML('beforeend', `<div class="app">${logo(k, 60)}<span>OmniCar ${C[k].name[0]}</span></div>`));
  h.insertAdjacentHTML('beforeend', `<div class="app"><div class="ph" style="background:${others[0][0]}"></div><span>${others[0][1]}</span></div>`);
  others.slice(1).forEach(([c, n]) => h.insertAdjacentHTML('beforeend', `<div class="app"><div class="ph" style="background:${c}"></div><span>${n}</span></div>`));
}
const PAL = [['#7C5CFF', 'Tím chất lỏng', 'điểm nhấn chính'], ['#3D7BFF', 'Xanh HarmonyOS', 'điểm nhấn phụ'], ['#22D3EE', 'Lục lam', 'trạng thái bật / sáng'],
  ['#FF5CA8', 'Hồng', 'nhấn nhẹ, nút đóng'], ['#0C0D12', 'Mực đêm', 'nền tối'], ['rgba(255,255,255,.18)', 'Kính mờ', 'bảng / thanh / phím']];
document.getElementById('pal').innerHTML = PAL.map(([c, n, u]) => `<div class="sw"><i style="background:${c};${c.startsWith('rgba') ? 'background-image:linear-gradient(135deg,#7C5CFF55,#22D3EE55);' : ''}"></i><div><b>${n}</b>${c.startsWith('#') ? c : ''}<br><span>${u}</span></div></div>`).join('');
</script>
</body>
</html>
